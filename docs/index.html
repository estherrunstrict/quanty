<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oracle</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#08080a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════
   ORACLE DASHBOARD
   Aesthetic: Dark brutalist-minimal. Monochrome canvas,
   single amber accent. Newsreader serif for hierarchy,
   DM Mono for data. Dense but breathable.
   ══════════════════════════════════════════════════════ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #08080a;
  --s1: #0e0e11;
  --s2: #141418;
  --s3: #1a1a1f;
  --s4: #222228;
  --border: #1e1e24;
  --border-h: #2a2a32;
  --tx: #e2ded8;
  --tx2: #8a857e;
  --tx3: #55524d;
  --tx4: #333130;
  --accent: #c9a24d;
  --accent-d: #c9a24d18;
  --g: #3a8a5a;
  --g-bg: #3a8a5a10;
  --r: #a84848;
  --r-bg: #a8484810;
  --blue: #4a78a8;
  --purple: #7a68a8;
  --mono: 'DM Mono', 'SF Mono', 'Menlo', monospace;
  --serif: 'Newsreader', 'Georgia', serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

html { font-size: 13px; }

body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--mono);
  font-weight: 300;
  line-height: 1.55;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: var(--safe-b);
}

/* Grain */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

a { color: var(--accent); text-decoration: none; }

.shell {
  max-width: 1440px;
  margin: 0 auto;
  padding: 1.8rem 2.5rem;
}

/* ── Loading State ── */
.loading-state {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  flex-direction: column;
  gap: 1rem;
}

.loading-state .spinner {
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-state span { color: var(--tx3); font-size: 0.8rem; }

/* ── Header ── */
.hdr {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
}

.hdr h1 {
  font-family: var(--serif);
  font-weight: 300;
  font-size: 1.6rem;
  letter-spacing: -0.03em;
}

.hdr h1 em { font-style: italic; color: var(--accent); }

.hdr-right {
  display: flex;
  gap: 1.5rem;
  align-items: center;
}

.live-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--g);
  display: inline-block;
  margin-right: 0.4rem;
  animation: blink 2.5s ease infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.hdr-meta { font-size: 0.75rem; color: var(--tx3); }

.refresh-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--tx3);
  font-family: var(--mono);
  font-size: 0.7rem;
  padding: 0.3rem 0.7rem;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.05em;
}

.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Metric Strip ── */
.strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--border);
  margin-bottom: 2rem;
}

.strip .cell {
  background: var(--s1);
  padding: 1rem 1.2rem;
}

.strip .cell:hover { background: var(--s2); }

.cell .lbl {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--tx4);
  margin-bottom: 0.35rem;
}

.cell .val {
  font-size: 1.35rem;
  font-weight: 500;
  letter-spacing: -0.03em;
  white-space: nowrap;
}

.cell .sub {
  font-size: 0.72rem;
  color: var(--tx3);
  margin-top: 0.15rem;
}

.up { color: var(--g); }
.dn { color: var(--r); }
.amber { color: var(--accent); }

/* ── Whole-Investment Hero ──
   Row A total (KIS+Upbit+Toss) / Row B per-account tiles / Row C bots-manual-cash
   split. Everything it reads is additive JSON (data.totals, data.accounts): when
   an older generator publishes without them the whole block is skipped and the
   metric strip below is unchanged. */
.hero {
  border: 1px solid var(--border);
  background: var(--s1);
  margin-bottom: 2rem;
}

.hero-top { padding: 1.4rem 1.4rem 1.2rem; }

.hero-lbl {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--tx4);
  margin-bottom: 0.55rem;
}

.hero-val {
  font-family: var(--serif);
  font-size: 2.6rem;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.03em;
}

.hero-sub { font-size: 0.72rem; color: var(--tx3); margin-top: 0.55rem; }
.hero-pnl { font-size: 0.78rem; margin-top: 0.3rem; }

.hero-accts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border-top: 1px solid var(--border);
}

.hero-acct { background: var(--s1); padding: 0.9rem 1.4rem; }
.hero-acct.stale .a-val { color: var(--tx3); }

.hero-acct .a-name {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--tx4);
}

.hero-acct .a-val {
  font-size: 1.1rem;
  margin-top: 0.35rem;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.hero-acct .a-meta { font-size: 0.62rem; color: var(--tx3); margin-top: 0.2rem; }

.badge-stale {
  font-size: 0.5rem;
  letter-spacing: 0.1em;
  padding: 0 0.3rem;
  border: 1px solid var(--r);
  color: var(--r);
}

.hero-split { padding: 1.1rem 1.4rem 1.3rem; border-top: 1px solid var(--border); }

.split-bar { display: flex; height: 10px; background: var(--s3); overflow: hidden; }
.split-seg { height: 100%; }

.split-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 1.3rem;
  margin-top: 0.7rem;
  font-size: 0.68rem;
  color: var(--tx2);
}

.split-legend .sl { display: flex; align-items: baseline; gap: 0.4rem; }
.split-legend b { color: var(--tx); font-weight: 500; }
.split-sw { width: 8px; height: 8px; align-self: center; }

.recon-warn { color: var(--r); font-size: 0.66rem; margin-top: 0.6rem; }

/* ── Grid ── */
.grid {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 2rem;
}

/* ── Strategy Rows ── */
.strats { display: flex; flex-direction: column; gap: 1px; background: var(--border); }

.strat {
  background: var(--s1);
  padding: 1.3rem 1.4rem;
  transition: background 0.2s;
}

.strat:hover { background: var(--s2); }

.strat-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 0.8rem;
}

.strat-name {
  font-family: var(--serif);
  font-size: 1.05rem;
  font-weight: 300;
}

.tag {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding: 0.15rem 0.55rem;
  border: 1px solid var(--border-h);
  color: var(--tx3);
}

.tag.live { border-color: var(--g); color: var(--g); }
.tag.paper { border-color: var(--accent); color: var(--accent); }
.tag.stale { border-color: var(--r); color: var(--r); }
.tag.manual { border-color: #8a8a8a; color: #8a8a8a; }

/* Hands-on sleeve: same card, no bot colour — it is Jae's own hand, not a bot. */
.strat.manual { box-shadow: inset 2px 0 0 #8a8a8a; }

.strat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 0.2rem 1.2rem;
}

.sg-lbl {
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--tx4);
}

.sg-val { font-size: 0.88rem; }

/* Holdings table */
.holds {
  margin-top: 0.8rem;
  padding-top: 0.7rem;
  border-top: 1px solid var(--border);
}

.hold-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 0.2rem 0;
  font-size: 0.8rem;
}

.hold-tk { color: var(--tx); min-width: 55px; font-weight: 400; }

/* 종목이 많은 카드(NMF2 30종목, 수동 슬리브)는 잘라내지 않고 스크롤시킨다.
   '+25 more' 로 접어 두면 정작 무엇을 들고 있는지 확인할 수가 없다. */
.holds.scroll { max-height: 15rem; overflow-y: auto; }
.holds.scroll::-webkit-scrollbar { width: 5px; }
.holds.scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* 종목명은 코드보다 길고 한글은 폭이 제각각이라 별도 폭을 준다. */
.hold-nm { color: var(--tx); font-weight: 400; min-width: 6.5rem; max-width: 11rem;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hold-det { color: var(--tx3); flex: 1; text-align: right; padding: 0 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hold-pl { min-width: 80px; text-align: right; }

/* Signal badge */
.sig {
  display: inline-block;
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 0.2rem 0.6rem;
  margin-top: 0.7rem;
}

.sig.long { background: var(--g-bg); border: 1px solid var(--g); color: var(--g); }
.sig.cash { background: var(--accent-d); border: 1px solid var(--accent); color: var(--accent); }
.sig.bear { background: var(--r-bg); border: 1px solid var(--r); color: var(--r); }

/* ── Strategy Comparison Chart ── */
.cmp {
  margin-bottom: 2rem;
  padding: 1.4rem 1.5rem;
  background: var(--s1);
  border: 1px solid var(--border);
}
.cmp-hdr { margin-bottom: 1rem; }
.cmp-title {
  font-family: var(--serif);
  font-weight: 300;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
  margin: 0;
}
.cmp-sub {
  font-size: 0.7rem;
  color: var(--tx3);
  margin-top: 0.25rem;
}
.cmp-chart {
  display: flex;
  gap: 0.4rem;
  align-items: stretch;
}
.cmp-y-axis {
  position: relative;
  width: 46px;
  flex-shrink: 0;
  height: 300px;
}
.cmp-y-axis span {
  position: absolute;
  right: 4px;
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--tx4);
  transform: translateY(-50%);
  white-space: nowrap;
}
.cmp-plot {
  flex: 1;
  position: relative;
  height: 300px;
}
.cmp-svg {
  width: 100%;
  height: 100%;
  display: block;
}
.cmp-x-axis {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  margin-top: 4px;
  height: 14px;
}
.cmp-x-axis span {
  position: absolute;
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--tx4);
  transform: translateX(-50%);
  white-space: nowrap;
}
.cmp-tooltip {
  position: absolute;
  top: 4px;
  background: var(--s3);
  border: 1px solid var(--border-h);
  padding: 0.5rem 0.7rem;
  pointer-events: none;
  z-index: 10;
  min-width: 200px;
}
.cmp-tt-date {
  font-family: var(--mono);
  color: var(--tx2);
  font-size: 0.62rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.3rem;
  margin-bottom: 0.35rem;
}
.cmp-tt-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.1rem 0;
  font-family: var(--serif);
  font-size: 0.78rem;
  white-space: nowrap;
}
.cmp-tt-pct {
  font-family: var(--mono);
  margin-left: auto;
  font-size: 0.7rem;
}
.cmp-legend {
  margin-top: 1.6rem;
  padding-top: 0.9rem;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.32rem;
}
.cmp-legend-row {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  font-family: var(--serif);
  font-size: 0.85rem;
}
.cmp-swatch {
  display: inline-block;
  width: 14px;
  height: 3px;
  flex-shrink: 0;
}
.cmp-name { flex: 1; }
.cmp-pct {
  font-family: var(--mono);
  font-size: 0.78rem;
  min-width: 84px;
  text-align: right;
}
.cmp-meta {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--tx3);
  min-width: 110px;
  text-align: right;
}
.cmp-detail {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--tx4);
}

/* ── Sparkline Charts ── */
.sparkline-wrap {
  margin-top: 0.6rem;
  padding-top: 0.5rem;
  border-top: 1px solid var(--border);
}
.sparkline-svg {
  width: 100%;
  height: 50px;
  display: block;
}
.sparkline-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.55rem;
  color: var(--tx3);
  margin-top: 0.15rem;
  padding: 0 2px;
}

/* ── Feed ── */
.feed { overflow: hidden; }

.feed-hdr {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--tx4);
  margin-bottom: 0.8rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--border);
}

.msgs { display: flex; flex-direction: column; gap: 0.4rem; }

.msg {
  background: var(--s1);
  border-left: 2px solid var(--border-h);
  padding: 0.85rem 1rem;
  transition: background 0.2s;
}

.msg:hover { background: var(--s2); }

.msg.t-buy { border-left-color: var(--g); }
.msg.t-sell { border-left-color: var(--r); }
.msg.t-signal { border-left-color: var(--accent); }
.msg.t-session { border-left-color: var(--purple); }
.msg.t-portfolio { border-left-color: var(--blue); }
.msg.t-error { border-left-color: var(--r); }

.msg-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.35rem;
}

.msg-tag {
  font-size: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--tx4);
}

.msg.t-buy .msg-tag { color: var(--g); }
.msg.t-sell .msg-tag { color: var(--r); }
.msg.t-signal .msg-tag { color: var(--accent); }
.msg.t-error .msg-tag { color: var(--r); }

.msg-ts { font-size: 0.6rem; color: var(--tx4); }

.msg-title {
  font-size: 0.82rem;
  font-weight: 400;
  margin-bottom: 0.25rem;
  line-height: 1.3;
}

.msg-body {
  font-size: 0.72rem;
  color: var(--tx3);
  line-height: 1.5;
  word-break: break-word;
}

.msg-src {
  font-size: 0.55rem;
  color: var(--tx4);
  margin-top: 0.4rem;
  padding-top: 0.3rem;
  border-top: 1px solid var(--border);
}

/* ── Footer ── */
.ftr {
  border-top: 1px solid var(--border);
  padding-top: 1.2rem;
  margin-top: 2rem;
  display: flex;
  justify-content: space-between;
  color: var(--tx4);
  font-size: 0.6rem;
  letter-spacing: 0.04em;
}

/* ── Transitions ── */
.fade-in {
  opacity: 0;
  transform: translateY(6px);
  animation: fi 0.6s ease forwards;
}

@keyframes fi { to { opacity: 1; transform: none; } }

.d1 { animation-delay: 0.1s; }
.d2 { animation-delay: 0.2s; }
.d3 { animation-delay: 0.3s; }
.d4 { animation-delay: 0.4s; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-h); border-radius: 2px; }

/* ═══════════════════ MOBILE ═══════════════════ */
@media (max-width: 900px) {
  html { font-size: 14px; }

  .shell { padding: 1rem 1rem; }

  .hdr { flex-direction: column; gap: 0.6rem; margin-bottom: 1.2rem; padding-bottom: 0.8rem; }
  .hdr h1 { font-size: 1.4rem; }
  .hdr-right { width: 100%; justify-content: space-between; }

  .strip { grid-template-columns: repeat(2, 1fr); }
  .cell .val { font-size: 1.15rem; }

  .hero-top { padding: 1.1rem 1rem 1rem; }
  .hero-val { font-size: 1.9rem; }
  .hero-accts { grid-template-columns: 1fr; }
  .hero-acct { padding: 0.8rem 1rem; }
  .hero-split { padding: 0.9rem 1rem 1.1rem; }
  .split-legend { gap: 0.9rem; }

  .grid {
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }

  /* Swappable sections with tabs on mobile */
  .mob-tabs {
    display: flex;
    gap: 1px;
    background: var(--border);
    margin-bottom: 1.2rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .mob-tab {
    flex: 1;
    background: var(--s1);
    border: none;
    color: var(--tx3);
    font-family: var(--mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 0.7rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mob-tab.active {
    background: var(--s2);
    color: var(--accent);
  }

  .mob-section { display: none; }
  .mob-section.active { display: block; }

  .strat { padding: 1rem; }
  .strat-name { font-size: 0.95rem; }

  .strat-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 0.15rem 0.8rem;
  }

  .hold-row { font-size: 0.75rem; }
  .hold-det { display: none; }

  .msg { padding: 0.7rem 0.8rem; }
  .msg-title { font-size: 0.78rem; }

  .ftr { flex-direction: column; gap: 0.3rem; }
  .cmp { padding: 1rem; }
  .cmp-y-axis { height: 200px; width: 38px; }
  .cmp-plot { height: 200px; }
  .cmp-legend-row { flex-wrap: wrap; gap: 0.4rem; }
  .cmp-pct { min-width: 70px; }
  .cmp-meta { min-width: 0; flex-basis: 100%; text-align: left; padding-left: 22px; }
}

/* Very small phones */
@media (max-width: 400px) {
  .shell { padding: 0.8rem 0.6rem; }
  .strip { grid-template-columns: 1fr 1fr; }
  .cell .val { font-size: 1rem; }
  .strat-grid { grid-template-columns: 1fr 1fr; }
}

/* Desktop: hide mobile tabs */
@media (min-width: 901px) {
  .mob-tabs { display: none; }
  .mob-section { display: block !important; }
}
</style>
</head>
<body>

<div class="shell" id="app">
  <div class="loading-state" id="loader">
    <div class="spinner"></div>
    <span>connecting to oracle...</span>
  </div>
</div>

<script>
// ═══ Helpers ═══════════════════════════════════════════════
const $ = s => document.querySelector(s);
const h = (tag, cls, html) => {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (html !== undefined) el.innerHTML = html;
  return el;
};

function sym(currency) { return currency === 'KRW' ? '₩' : '$'; }

function fmtVal(v, currency) {
  if (currency === 'KRW') return '₩' + Math.round(v).toLocaleString();
  return '$' + v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function fmtPnl(v, currency) {
  const s = currency === 'KRW'
    ? '₩' + (v >= 0 ? '+' : '') + Math.round(v).toLocaleString()
    : '$' + (v >= 0 ? '+' : '') + v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  return s;
}

function pnlClass(v) { return v >= 0 ? 'up' : 'dn'; }

// Realized YTD cell — only rendered when the bot has closed at least one trade YTD.
// Intentionally silent on zero-trade bots so cards don't fill with meaningless zeros.
function realizedCell(realized, trades, currency) {
  if (!trades || trades <= 0) return '';
  const tradeSub = trades === 1 ? '(1 trade)' : `(${trades} trades)`;
  return `<div><div class="sg-lbl">Realized YTD</div><div class="sg-val ${pnlClass(realized || 0)}">${fmtPnl(realized || 0, currency)} <span style="color:var(--tx4);font-size:0.6rem">${tradeSub}</span></div></div>`;
}

// Per-bot derived metric cells (sourced from realized_pl_{year}.json + dashboard_server _enrich).
// Skip nulls silently — a freshly-deployed bot has no win-rate or MDD until trades land.
function totalPlCell(totalPl, currency, label) {
  const v = totalPl || 0;
  return `<div><div class="sg-lbl">${label || 'Total P/L'}</div><div class="sg-val ${pnlClass(v)}">${fmtPnl(v, currency)}</div></div>`;
}
function profitPctCell(pct, label) {
  if (pct === null || pct === undefined) return '';
  const sign = pct >= 0 ? '+' : '';
  return `<div><div class="sg-lbl">${label || 'Profit %'}</div><div class="sg-val ${pnlClass(pct)}">${sign}${pct.toFixed(2)}%</div></div>`;
}
function winRateCell(wr, cycles, label) {
  if (wr === null || wr === undefined) return '';
  return `<div><div class="sg-lbl">${label || 'Win Rate'}</div><div class="sg-val">${wr.toFixed(1)}% <span style="color:var(--tx4);font-size:0.6rem">(${cycles || 0}c)</span></div></div>`;
}
function mddCell(mdd, label) {
  if (mdd === null || mdd === undefined) return '';
  return `<div><div class="sg-lbl">${label || 'MDD'}</div><div class="sg-val dn">${mdd.toFixed(2)}%</div></div>`;
}
function cyclesCell(n, label) {
  return `<div><div class="sg-lbl">${label || 'Cycles'}</div><div class="sg-val">${n || 0}</div></div>`;
}

function relTime(ts) {
  if (!ts) return '';
  const d = new Date(ts.replace(' ', 'T'));
  const now = new Date();
  const diff = (now - d) / 1000 / 60;
  if (diff < 60) return Math.round(diff) + 'm ago';
  if (diff < 1440) return Math.round(diff / 60) + 'h ago';
  return Math.round(diff / 1440) + 'd ago';
}

function shortTime(ts) {
  if (!ts) return '';
  // Handle "2026-04-03 09:00:05" format
  const parts = ts.split(' ');
  if (parts.length >= 2) return parts[1].substring(0, 5);
  return ts;
}

// ═══ Sparkline Charts ═════════════════════════════════════
function renderSparkline(series, width = 280, height = 60) {
  // series: [[date, value], ...] — must have >= 2 points
  if (!series || series.length < 2) return '';

  const values = series.map(p => p[1]);
  const dates = series.map(p => p[0]);
  const minV = Math.min(...values);
  const maxV = Math.max(...values);
  const range = maxV - minV || 1;
  const pad = 2;

  const points = values.map((v, i) => {
    const x = pad + (i / (values.length - 1)) * (width - pad * 2);
    const y = pad + (1 - (v - minV) / range) * (height - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });

  const firstVal = values[0];
  const lastVal = values[values.length - 1];
  const pctChange = firstVal !== 0 ? ((lastVal / firstVal - 1) * 100) : 0;
  const color = pctChange >= 0 ? 'var(--g)' : 'var(--r)';
  const fillColor = pctChange >= 0 ? 'var(--g-bg)' : 'var(--r-bg)';

  // Create gradient fill path
  const fillPoints = `${pad},${height - pad} ${points.join(' ')} ${width - pad},${height - pad}`;

  const startLabel = dates[0].substring(5); // MM-DD
  const endLabel = dates[dates.length - 1].substring(5);

  return `
    <div class="sparkline-wrap">
      <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" class="sparkline-svg">
        <polygon points="${fillPoints}" fill="${fillColor}" />
        <polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" />
        <circle cx="${points[points.length - 1].split(',')[0]}" cy="${points[points.length - 1].split(',')[1]}" r="2.5" fill="${color}" />
      </svg>
      <div class="sparkline-meta">
        <span>${startLabel}</span>
        <span class="${pctChange >= 0 ? 'up' : 'dn'}">${pctChange >= 0 ? '+' : ''}${pctChange.toFixed(1)}%</span>
        <span>${endLabel}</span>
      </div>
    </div>
  `;
}

// ═══ Render ═══════════════════════════════════════════════
// ═══ Strategy Comparison Chart ═══════════════════════════
// Plots each bot's YTD Total P/L (realized + unrealized accrued daily) in KRW,
// plus a bold "Portfolio Total" overlay summing all bots per date.
function buildComparisonChart(equitySeries, aggregateSeries, strategies) {
  const seriesMeta = {
    btc_vb:        { name: 'BTC Volatility Breakout', stratId: 'btc_vb',        color: '#c9a24d' },
    korea_etf:     { name: 'Korea ETF Momentum',      stratId: 'korea_etf',     color: '#3a8a5a' },
    quant40:       { name: 'US Quant40',              stratId: 'quant40',       color: '#4a78a8' },
    jd_strategy:   { name: 'JD Strategy',             stratId: 'jd_strategy',   color: '#a84848' },
    dual_momentum: { name: 'Dual Momentum',           stratId: 'dual_momentum', color: '#7a68a8' }, // sole purple by spec
    claude_bot:    { name: 'Claude Trading Bot',      stratId: 'claude_bot',    color: '#5a9a8a' },
    // Toss-account bot. Its P/L runs at a ~W50k scale against the others' millions,
    // so the line hugs zero — that is honest for a W1M sleeve, not a bug.
    nmf2:          { name: 'NMF2 (신마법공식 2.0)',     stratId: 'nmf2',          color: '#a8688a' },
    hybrid_vb_kr:  { name: 'Hybrid VB (KR)',          stratId: 'hybrid_vb',     sub: 'kr', color: '#c9a24d99' },
    hybrid_vb_us:  { name: 'Hybrid VB (US)',          stratId: 'hybrid_vb',     sub: 'us', color: '#4a78a899' },
  };

  const stratIndex = {};
  (strategies || []).forEach(s => { stratIndex[s.id] = s; });

  const allDates = new Set();
  const prepared = Object.keys(seriesMeta).map(key => {
    const meta = seriesMeta[key];
    const raw = (equitySeries || {})[key] || [];
    const strat = stratIndex[meta.stratId] || {};
    const sub = meta.sub ? (strat[meta.sub] || {}) : strat;
    const wr = sub.win_rate_pct;
    const cycles = sub.cycles_ytd;
    const entry = {
      key, name: meta.name, color: meta.color,
      wr, cycles, points: [], finalVal: null, insufficient: false,
      isPortfolio: false,
    };
    if (raw.length < 2) {
      entry.insufficient = true;
      return entry;
    }
    raw.forEach(([date, val]) => {
      entry.points.push({ date, val });
      allDates.add(date);
    });
    entry.finalVal = entry.points[entry.points.length - 1].val;
    return entry;
  });

  // Portfolio Total — sum of all bots' total P/L per date, drawn last so it
  // sits on top of per-bot lines.
  const portfolioRaw = (aggregateSeries || {}).total || [];
  if (portfolioRaw.length >= 2) {
    const portEntry = {
      key: 'portfolio', name: 'Portfolio Total', color: 'var(--tx)',
      wr: null, cycles: null, points: [], finalVal: null, insufficient: false,
      isPortfolio: true,
    };
    portfolioRaw.forEach(([date, val]) => {
      portEntry.points.push({ date, val });
      allDates.add(date);
    });
    portEntry.finalVal = portEntry.points[portEntry.points.length - 1].val;
    prepared.push(portEntry);
  }

  const dateList = [...allDates].sort();
  if (dateList.length < 2) return null;
  const dateToIdx = {};
  dateList.forEach((d, i) => { dateToIdx[d] = i; });

  let minY = 0, maxY = 0;
  prepared.forEach(p => {
    if (p.insufficient) return;
    p.points.forEach(pt => {
      if (pt.val < minY) minY = pt.val;
      if (pt.val > maxY) maxY = pt.val;
    });
  });
  // Always include zero so positive/negative are both visible against the axis.
  if (minY > 0) minY = 0;
  if (maxY < 0) maxY = 0;
  const padY = ((maxY - minY) || 100000) * 0.08;
  const yLo = minY - padY;
  const yHi = maxY + padY;

  // SVG uses an internal 1000x1000 coordinate space; CSS stretches it to fill
  // the .cmp-plot box. vector-effect="non-scaling-stroke" keeps line weight
  // consistent under non-uniform scaling.
  const VB = 1000;
  const xFor = (idx) => (idx / (dateList.length - 1)) * VB;
  const yFor = (val) => (1 - (val - yLo) / (yHi - yLo)) * VB;

  const zeroLine = (yLo <= 0 && yHi >= 0)
    ? `<line x1="0" y1="${yFor(0).toFixed(1)}" x2="${VB}" y2="${yFor(0).toFixed(1)}" stroke="var(--tx4)" stroke-width="0.5" stroke-dasharray="4,4" vector-effect="non-scaling-stroke"/>`
    : '';

  const linesSvg = prepared.filter(p => !p.insufficient).map(p => {
    const pts = p.points.map(pt => `${xFor(dateToIdx[pt.date]).toFixed(1)},${yFor(pt.val).toFixed(1)}`).join(' ');
    const sw = p.isPortfolio ? 2.5 : 1.5;
    return `<polyline data-key="${p.key}" points="${pts}" fill="none" stroke="${p.color}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  }).join('');

  const cursor = `<line class="cmp-cursor" x1="0" y1="0" x2="0" y2="${VB}" stroke="var(--tx2)" stroke-width="0.5" stroke-dasharray="3,3" vector-effect="non-scaling-stroke" style="display:none"/>`;
  const overlay = `<rect class="cmp-overlay" x="0" y="0" width="${VB}" height="${VB}" fill="transparent" pointer-events="all"/>`;

  // KRW formatter: ₩+50K / ₩+1.2M / ₩-3K — compact, signed, never floats.
  const fmtKrw = (v) => {
    const sign = v >= 0 ? '+' : '−';
    const a = Math.abs(v);
    if (a >= 1e6) return '₩' + sign + (a / 1e6).toFixed(1) + 'M';
    if (a >= 1e3) return '₩' + sign + Math.round(a / 1e3) + 'K';
    return '₩' + sign + Math.round(a);
  };

  // Y-axis labels: top, zero (if in range), bottom.
  const yLabels = [];
  yLabels.push({ val: yHi, top: 0 });
  if (yLo < 0 && yHi > 0) yLabels.push({ val: 0, top: ((yHi - 0) / (yHi - yLo)) * 100 });
  yLabels.push({ val: yLo, top: 100 });
  const yAxisHTML = yLabels.map(l =>
    `<span style="top:${l.top.toFixed(2)}%">${fmtKrw(l.val)}</span>`
  ).join('');

  // X-axis: 4-5 evenly spaced date ticks (MM-DD).
  const tickCount = Math.min(5, dateList.length);
  const tickIdxs = [];
  for (let i = 0; i < tickCount; i++) {
    tickIdxs.push(Math.round(i * (dateList.length - 1) / (tickCount - 1)));
  }
  const xAxisHTML = [...new Set(tickIdxs)].map(i => {
    const left = (i / (dateList.length - 1)) * 100;
    return `<span style="left:${left.toFixed(2)}%">${dateList[i].substring(5)}</span>`;
  }).join('');

  // Legend: portfolio sum pinned to top, then per-bot by final value desc;
  // insufficient-data rows pinned to bottom.
  const sorted = [...prepared].sort((a, b) => {
    if (a.isPortfolio !== b.isPortfolio) return a.isPortfolio ? -1 : 1;
    if (a.insufficient !== b.insufficient) return a.insufficient ? 1 : -1;
    if (a.insufficient) return 0;
    return b.finalVal - a.finalVal;
  });
  const legendHTML = sorted.map(p => {
    if (p.insufficient) {
      return `<div class="cmp-legend-row"><span class="cmp-swatch" style="background:${p.color}"></span><span class="cmp-name">${p.name}</span><span class="cmp-detail">— insufficient data</span></div>`;
    }
    const valStr = fmtKrw(p.finalVal);
    const valCls = p.finalVal >= 0 ? 'up' : 'dn';
    if (p.isPortfolio) {
      return `<div class="cmp-legend-row" style="font-weight:600;border-bottom:1px solid var(--border);padding-bottom:0.4rem;margin-bottom:0.2rem"><span class="cmp-swatch" style="background:${p.color}"></span><span class="cmp-name">${p.name}</span><span class="cmp-pct ${valCls}">${valStr}</span></div>`;
    }
    const wrPart = (p.wr === null || p.wr === undefined) ? '' : `, ${p.wr.toFixed(0)}% WR`;
    const metaStr = `(${p.cycles || 0}c${wrPart})`;
    return `<div class="cmp-legend-row"><span class="cmp-swatch" style="background:${p.color}"></span><span class="cmp-name">${p.name}</span><span class="cmp-pct ${valCls}">${valStr}</span><span class="cmp-meta">${metaStr}</span></div>`;
  }).join('');

  const section = h('section', 'cmp fade-in d1');
  section.innerHTML = `
    <div class="cmp-hdr">
      <h2 class="cmp-title">Strategy Comparison · 2026 YTD</h2>
      <div class="cmp-sub">Total P/L per bot (realized + unrealized accrued) + portfolio sum, in KRW</div>
    </div>
    <div class="cmp-chart">
      <div class="cmp-y-axis">${yAxisHTML}</div>
      <div class="cmp-plot">
        <svg class="cmp-svg" viewBox="0 0 ${VB} ${VB}" preserveAspectRatio="none">
          ${zeroLine}
          ${linesSvg}
          ${cursor}
          ${overlay}
        </svg>
        <div class="cmp-x-axis">${xAxisHTML}</div>
        <div class="cmp-tooltip" style="display:none"></div>
      </div>
    </div>
    <div class="cmp-legend">${legendHTML}</div>
  `;

  // Hover: snap a vertical cursor to the nearest unified date and show a
  // tooltip listing each bot that has a sample on that date.
  const svgEl = section.querySelector('.cmp-svg');
  const overlayEl = section.querySelector('.cmp-overlay');
  const cursorEl = section.querySelector('.cmp-cursor');
  const tooltipEl = section.querySelector('.cmp-tooltip');
  const plotEl = section.querySelector('.cmp-plot');

  overlayEl.addEventListener('mousemove', (e) => {
    const rect = svgEl.getBoundingClientRect();
    if (!rect.width) return;
    const xVB = (e.clientX - rect.left) / rect.width * VB;
    let nearestIdx = 0, nearestDist = Infinity;
    for (let i = 0; i < dateList.length; i++) {
      const px = xFor(i);
      const d = Math.abs(px - xVB);
      if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
    }
    const date = dateList[nearestIdx];
    const cursorX = xFor(nearestIdx);
    cursorEl.setAttribute('x1', cursorX);
    cursorEl.setAttribute('x2', cursorX);
    cursorEl.style.display = '';

    const rows = prepared
      .filter(p => !p.insufficient)
      .map(p => {
        const pt = p.points.find(x => x.date === date);
        if (!pt) return null;
        return { name: p.name, color: p.color, val: pt.val };
      })
      .filter(Boolean)
      .sort((a, b) => b.val - a.val);

    if (!rows.length) {
      tooltipEl.style.display = 'none';
      return;
    }

    tooltipEl.innerHTML = `<div class="cmp-tt-date">${date}</div>` + rows.map(r => {
      return `<div class="cmp-tt-row"><span class="cmp-swatch" style="background:${r.color}"></span><span>${r.name}</span><span class="cmp-tt-pct ${r.val >= 0 ? 'up' : 'dn'}">${fmtKrw(r.val)}</span></div>`;
    }).join('');

    const plotRect = plotEl.getBoundingClientRect();
    const cursorPx = (cursorX / VB) * rect.width + (rect.left - plotRect.left);
    tooltipEl.style.display = '';
    const ttW = tooltipEl.offsetWidth;
    const overflowsRight = cursorPx + 12 + ttW > plotRect.width - 4;
    tooltipEl.style.left = (overflowsRight ? cursorPx - ttW - 12 : cursorPx + 12) + 'px';
  });

  overlayEl.addEventListener('mouseleave', () => {
    cursorEl.style.display = 'none';
    tooltipEl.style.display = 'none';
  });

  return section;
}

// ═══ Render ═══════════════════════════════════════════════
function render(data) {
  const app = $('#app');
  app.innerHTML = '';

  // ── Header
  const hdr = h('header', 'hdr fade-in');
  hdr.innerHTML = `
    <h1>Automation <em>Oracle</em></h1>
    <div class="hdr-right">
      <span class="hdr-meta"><span class="live-dot"></span>${data.strategies.filter(s => s.id !== 'manual').length} strategies</span>
      <span class="hdr-meta">${data.meta.kst}</span>
      <a class="refresh-btn" href="decision.html" style="text-decoration:none">→ Decision Center</a>
      <button class="refresh-btn" onclick="load()">Refresh</button>
    </div>
  `;
  app.appendChild(hdr);

  // ── Account-level data (from generate_dashboard_data.py → KIS API query)
  const portfolio = data.portfolio || {};
  const totalAsset = portfolio.total_value_krw || 0;
  const cashKRW = portfolio.cash_krw || 0;
  const cashUSD = portfolio.cash_usd || 0;
  const upbitKRW = portfolio.upbit_krw || 0;
  const exchangeRate = portfolio.exchange_rate || 1380;

  // ── Sum realized + unrealized from all bots (per-currency)
  let unrealKRW = 0, unrealUSD = 0;
  let realKRW = 0,   realUSD = 0;
  data.strategies.forEach(s => {
    if (s.currency === 'KRW') {
      unrealKRW += (s.unrealized_profit ?? s.profit ?? 0);
      realKRW   += (s.realized_profit_ytd || 0);
    } else if (s.currency === 'USD') {
      unrealUSD += (s.unrealized_profit ?? s.profit ?? 0);
      realUSD   += (s.realized_profit_ytd || 0);
    } else if (s.currency === 'MULTI') {
      unrealKRW += (s.kr?.unrealized_profit ?? s.kr?.profit ?? 0);
      unrealUSD += (s.us?.unrealized_profit ?? s.us?.profit ?? 0);
      realKRW   += (s.kr?.realized_profit_ytd || 0);
      realUSD   += (s.us?.realized_profit_ytd || 0);
    }
  });
  const unrealCombined = unrealKRW + unrealUSD * exchangeRate;
  const realCombined   = realKRW   + realUSD   * exchangeRate;
  const totalPnlCombined = unrealCombined + realCombined;
  const originalDeposit = portfolio.original_deposit_krw || 1;
  const totalPnlPct = originalDeposit > 0 ? (totalPnlCombined / originalDeposit * 100) : 0;

  // ── Whole-Investment hero
  // Jae runs most of his money by hand, in front of the bots, and it lives in
  // three brokers. The strip below only ever knew about KIS + Upbit; this block
  // is the honest headline: KIS + Upbit + Toss, then where that money actually
  // sits (bots / his own hand / cash). Rendered only when the generator supplies
  // the additive `totals` + `accounts` keys, so an older JSON degrades to the
  // pre-existing page instead of showing zeroes.
  const T = data.totals || null;
  const ACCT = data.accounts || {};
  if (T && T.investments_krw > 0) {
    const hero = h('section', 'hero fade-in');
    const invUSD = exchangeRate > 0 ? T.investments_krw / exchangeRate : 0;

    const tile = (key, label) => {
      const a = ACCT[key] || {};
      const val = a.total_krw || 0;
      // A sleeve is greyed when the generator says so OR when it has no money to
      // report — never silently dropped, because a missing tile reads as "I don't
      // have that account" rather than "I couldn't see it today".
      const stale = !!a.stale || !(val > 0);
      let meta;
      if (stale) {
        meta = a.last_seen_at ? 'last seen ' + String(a.last_seen_at).substring(0, 10)
                              : (a.note ? String(a.note).substring(0, 44) : 'no data');
      } else {
        meta = String(a.as_of || '').replace('T', ' ').substring(0, 16);
      }
      return `<div class="hero-acct${stale ? ' stale' : ''}">
        <div class="a-name">${label}${stale ? '<span class="badge-stale">Stale</span>' : ''}</div>
        <div class="a-val">₩${Math.round(val).toLocaleString()}</div>
        <div class="a-meta">${meta}</div>
      </div>`;
    };

    const sp = T.split_pct || {};
    const seg = (pct, color) => (pct > 0)
      ? `<div class="split-seg" style="width:${pct}%;background:${color}"></div>` : '';
    const leg = (color, label, pct, krw) =>
      `<span class="sl"><span class="split-sw" style="background:${color}"></span>` +
      `${label} <b>${(pct || 0).toFixed(1)}%</b> <span style="color:var(--tx3)">₩${Math.round(krw || 0).toLocaleString()}</span></span>`;

    const warn = T.reconciliation_warning
      ? `<div class="recon-warn">⚠ ₩${Math.round(Math.abs(T.reconciliation_gap_krw || 0)).toLocaleString()} of the account totals is unaccounted for (${(T.reconciliation_gap_pct || 0).toFixed(2)}%) — treat the split as approximate.</div>`
      : '';

    hero.innerHTML = `
      <div class="hero-top">
        <div class="hero-lbl">Total Investments</div>
        <div class="hero-val">₩${Math.round(T.investments_krw).toLocaleString()}</div>
        <div class="hero-sub">≈ $${Math.round(invUSD).toLocaleString()} · KIS + CMA + Upbit + Toss</div>
        <div class="hero-pnl ${pnlClass(totalPnlCombined)}">Bot P/L YTD ${fmtPnl(totalPnlCombined, 'KRW')} (${totalPnlPct >= 0 ? '+' : ''}${totalPnlPct.toFixed(2)}% of deposits)</div>
      </div>
      <div class="hero-accts">
        ${tile('kis', 'KIS')}${tile('cma', 'CMA')}${tile('upbit', 'Upbit')}${tile('toss', 'Toss')}
      </div>
      <div class="hero-split">
        <div class="split-bar">
          ${seg(sp.bots, 'var(--accent)')}${seg(sp.manual, '#8a8a8a')}${seg(sp.cash, 'var(--blue)')}
        </div>
        <div class="split-legend">
          ${leg('var(--accent)', 'Bots', sp.bots, T.bots_krw)}
          ${leg('#8a8a8a', 'Hands-on', sp.manual, T.manual_krw)}
          ${leg('var(--blue)', 'Cash', sp.cash, T.cash_krw)}
        </div>
        ${warn}
      </div>
    `;
    app.appendChild(hero);
  }

  // ── Strip
  const strip = h('section', 'strip fade-in d1');
  const stripData = totalAsset > 0 ? [
    { lbl: 'Total Assets', val: '₩' + Math.round(totalAsset).toLocaleString(), sub: 'KIS + Upbit combined' },
    { lbl: 'KIS Cash', val: '₩' + Math.round(cashKRW).toLocaleString(), sub: '$' + cashUSD.toLocaleString(undefined, {maximumFractionDigits: 0}) + ' USD' },
    { lbl: 'Upbit (BTC)', val: '₩' + Math.round(upbitKRW).toLocaleString(), sub: 'Separate account' },
    { lbl: 'Realized YTD', val: fmtPnl(realCombined, 'KRW'), cls: pnlClass(realCombined), sub: 'KRW ' + fmtPnl(realKRW, 'KRW') + ' + USD ' + fmtPnl(realUSD, 'USD') },
    { lbl: 'Unrealized', val: fmtPnl(unrealCombined, 'KRW'), cls: pnlClass(unrealCombined), sub: 'KRW ' + fmtPnl(unrealKRW, 'KRW') + ' + USD ' + fmtPnl(unrealUSD, 'USD') },

      const usTrades = us.realized_trades || 0;

      const usBudget = s.budget_us || 0;
      const krPct = krBudget > 0 ? Math.round(krInvested / krBudget * 100) : 0;
      const usPct = usBudget > 0 ? Math.round(usInvested / usBudget * 100) : 0;
      const krPos = Object.keys(s.open_positions?.kr || {}).length;
      const usPos = Object.keys(s.open_positions?.us || {}).length;
      metricsHTML = `
        <div><div class="sg-lbl">KR Invested</div><div class="sg-val">${fmtVal(krInvested, 'KRW')} <span style="color:var(--tx4)">(${krPct}%)</span></div></div>

    else if (s.id === 'claude_bot') {

    else if (isManual) {

        <div><div class="sg-lbl">KIS Unrealized</div><div class="sg-val ${pnlClass(ex.kis_unrealized_krw || 0)}">${fmtPnl(ex.kis_unrealized_krw || 0, 'KRW')}</div></div>

    // Holdings
    const holdings = (s.id === 'hybrid_vb') ? s.holdings : (s.holdings || []);
    if (holdings.length > 0) {
      // NMF2 는 30종목을 전부 보여주고 스크롤한다. 5개만 보이면 바스켓을 확인할 수 없다.

    // Open positions for Hybrid VB
    if (s.id === 'hybrid_vb') {
      const ops = s.open_positions || {};
      let posRows = '';
      for (const [market, positions] of Object.entries(ops)) {

            <span class="hold-tk">${ticker}</span>

      const rows = mHoldings.map(hld => {
        const label = hld.name || hld.ticker;

          <span class="${hld.name ? 'hold-nm' : 'hold-tk'}">${label}</span>
          <span class="hold-det">${code}${qty} × ${sym(hld.currency || 'KRW')}${(hld.current_price || 0).toLocaleString(undefined, hld.currency === 'USD' ? {minimumFractionDigits:2, maximumFractionDigits:2} : {maximumFractionDigits:0})}</span>
          <span class="hold-pl ${typeof hld.profit_rate === 'number' ? pnlClass(hld.pl_krw || 0) : ''}" ${typeof hld.profit_rate === 'number' ? '' : 'style="color:var(--tx2)"'}>${typeof hld.profit_rate === 'number' ? fmtPnl(hld.pl_krw || 0, 'KRW') + ' (' + (hld.profit_rate >= 0 ? '+' : '') + hld.profit_rate.toFixed(1) + '%)' : '₩' + Math.round(hld.value_krw || 0).toLocaleString()}</span>
        </div>`;
      }).join('');
      holdingsHTML = rows ? `<div class="holds${mHoldings.length > 6 ? ' scroll' : ''}">${rows}</div>` : '';
    }

    // Sparkline chart from equity_series
    let chartHTML = '';
    const eqSeries = data.equity_series || {};
    const chartId = s.id;
    if (eqSeries[chartId] && eqSeries[chartId].length >= 2) {
      chartHTML = renderSparkline(eqSeries[chartId]);
    }

    card.innerHTML = `
      <div class="strat-top">
        <span class="strat-name">${s.name}</span>
        <span class="tag ${modeTag}">${modeLabel}</span>
      </div>
      <div class="strat-grid">${metricsHTML}</div>
      ${chartHTML}
      ${holdingsHTML}
      ${signalHTML}
    `;
    strats.appendChild(card);
  });

  stratsWrap.appendChild(strats);
  grid.appendChild(stratsWrap);

  // ── Feed
  const feedWrap = h('div', 'mob-section', '');
  feedWrap.dataset.section = 'feed';
  const feed = h('aside', 'feed fade-in d3');
  feed.innerHTML = `<div class="feed-hdr">Activity Feed</div>`;

  const msgs = h('div', 'msgs');

  if (data.feed && data.feed.length > 0) {
    data.feed.forEach(ev => {
      const typeMap = {
        'trade_buy': 't-buy', 'trade_sell': 't-sell',
        'signal': 't-signal', 'session': 't-session',
        'portfolio': 't-portfolio', 'error': 't-error'
      };
      const tagMap = {
        'trade_buy': 'Buy', 'trade_sell': 'Sell',
        'signal': 'Signal', 'session': 'Session',
        'portfolio': 'Portfolio', 'error': 'Error'
      };

      const cls = typeMap[ev.type] || 't-session';
      const tag = tagMap[ev.type] || ev.type;

      const m = h('div', `msg ${cls}`);
      m.innerHTML = `
        <div class="msg-top">
          <span class="msg-tag">${tag}</span>
          <span class="msg-ts">${shortTime(ev.timestamp)}</span>
        </div>
        <div class="msg-title">${ev.title}</div>
        <div class="msg-body">${ev.body || ''}</div>
        <div class="msg-src">${ev.source || ''} · ${relTime(ev.timestamp)}</div>
      `;
      msgs.appendChild(m);
    });
  } else {
    msgs.innerHTML = '<div class="msg"><div class="msg-body">No recent events. Logs may not be accessible from this host.</div></div>';
  }

  feed.appendChild(msgs);
  feedWrap.appendChild(feed);
  grid.appendChild(feedWrap);

  app.appendChild(grid);

  // ── Footer
  const ftr = h('footer', 'ftr fade-in d4');
  ftr.innerHTML = `
    <span>automation oracle · oracle cloud · 193.123.246.52</span>
    <span>auto-refresh 60s · cron: check_and_run.sh</span>
  `;
  app.appendChild(ftr);
}

// ═══ Data Fetching ════════════════════════════════════════
let refreshTimer = null;

async function load() {
  try {
    const [res, histRes] = await Promise.all([
      fetch('data/dashboard_data.json'),
      fetch('data/equity_history.json').catch(()=>null)
    ]);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (histRes && histRes.ok) {
      const eqData = await histRes.json();
      if (!data.equity_series) data.equity_series = eqData;
    }
    render(data);
  } catch (e) {
    const app = document.querySelector('#app');
    const loader = document.querySelector('#loader');
    if (loader) {
      app.innerHTML = '<header class="hdr fade-in"><h1>Automation <em>Oracle</em></h1>' +
        '<div class="hdr-right"><a class="refresh-btn" href="decision.html" style="text-decoration:none">→ Decision Center</a></div></header>' +
        '<div style="padding:3rem 0;text-align:center;color:var(--tx3);font-size:0.8rem">' +
        'Dashboard data not available. Updated daily after market close.</div>';
    }
  }
}

load();
</script>
