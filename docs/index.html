<body>

<canvas id="bgfx" aria-hidden="true"></canvas>
<div id="bgfx-brush" aria-hidden="true"></div>
<div class="shell" id="app">
  <div class="loading-state" id="loader">
    <div class="spinner"></div>
    <span>connecting to oracle...</span>
  </div>
</div>

<script>
// ═══ Chrome backdrop ═══════════════════════════════════════
// Five soft lobes drifting on incommensurable sine periods, composited
// additively into a 96x60 buffer that CSS stretches over the viewport. The
// upscale IS the blur, which is why a full-screen animated gradient costs
// about six thousand pixels of fill per frame instead of two million.
//
// Three things keep it from being a liability on a page of six-figure numbers:
//   - peak luminance is capped near #1a1c22, so panels at 0.82 alpha land
//     within a couple of points of the flat colour they used to be;
//   - it stops dead when the tab is hidden — this page is left open all day
//     behind other windows, and a rAF loop nobody is looking at is pure heat;
//   - prefers-reduced-motion gets one static frame, not a stopped animation.
function startBackdrop() {
  const cv = document.getElementById('bgfx');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  if (!ctx) return;

  // Buffer size is fixed, NOT derived from the viewport: the lobes are drawn
  // in buffer space, so a resize that changed it would change the composition.
  const W = 96, H = 60;
  cv.width = W;
  cv.height = H;

  // Brushed steel, not aurora. The hues sit within a narrow band around
  // neutral — warm graphite, cold silver, a slightly blue shadow — because a
  // saturated backdrop turns an amber-accented page into a different brand,
  // and because every bot colour on this page was chosen against a NEUTRAL
  // card surface at a measured ΔE. One low amber lobe ties the metal to the
  // page accent. Alphas are small: these composite additively.
  const LOBES = [
    { c: '150,152,158', a: 0.26, r: 0.62, px: [0.22, 0.78], py: [0.18, 0.62], sx: 41, sy: 29 },
    { c: '208,212,220', a: 0.15, r: 0.42, px: [0.70, 0.26], py: [0.70, 0.24], sx: 53, sy: 37 },
    { c: '52, 60, 78',  a: 0.34, r: 0.85, px: [0.50, 0.14], py: [0.80, 0.10], sx: 67, sy: 43 },
    { c: '201,162,77',  a: 0.10, r: 0.36, px: [0.14, 0.62], py: [0.30, 0.78], sx: 79, sy: 59 },
    { c: '104,102,120', a: 0.12, r: 0.50, px: [0.84, 0.34], py: [0.42, 0.86], sx: 97, sy: 71 },
  ];

  // t is seconds; every period is a prime-ish number of seconds so the whole
  // field never visibly repeats.
  function frame(t) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#08080a';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const L of LOBES) {
      const fx = (Math.sin(t / L.sx * 2 * Math.PI) + 1) / 2;
      const fy = (Math.sin(t / L.sy * 2 * Math.PI + 1.7) + 1) / 2;
      const x = (L.px[0] + (L.px[1] - L.px[0]) * fx) * W;
      const y = (L.py[0] + (L.py[1] - L.py[0]) * fy) * H;
      const r = L.r * W;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(' + L.c + ',' + L.a + ')');
      g.addColorStop(0.55, 'rgba(' + L.c + ',' + (L.a * 0.32).toFixed(4) + ')');
      g.addColorStop(1, 'rgba(' + L.c + ',0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
  }

  const still = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still) { frame(11); return; }

  let raf = null, t0 = null;
  const tick = (ms) => {
    if (t0 === null) t0 = ms;
    frame((ms - t0) / 1000);
    raf = requestAnimationFrame(tick);
  };
  const play = () => { if (raf === null) raf = requestAnimationFrame(tick); };
  const stop = () => {
    if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
  };
  document.addEventListener('visibilitychange',
    () => (document.hidden ? stop() : play()));
  play();
}

// ═══ Helpers ═══════════════════════════════════════════════
const $ = s => document.querySelector(s);
// ── Bot identity colour ───────────────────────────────────────────────────
// The palette lives in the generator and travels in the data, so the page can
// never drift from what Discord uses. The literal below is a FALLBACK for an
// older cached JSON — keep it in sync, but the data always wins.
let BOT_COLORS = {
  btc_vb: '#c29a80', hybrid_vb: '#bcc251', claude_bot: '#5dc29f',
  korea_etf: '#408799', quant40: '#517ec2', dual_momentum: '#6851c2',
  nmf2: '#b880c2', jd_strategy: '#99406d', usvb: '#c754c7', manual: '#8a8a8a',
};
function botColor(id) { return BOT_COLORS[id] || '#6a6a6a'; }
// Same hue, low alpha — for fills that sit behind text.
function botTint(id, alpha) { return botColor(id) + (alpha || '22'); }
// Hybrid VB charts its KR and US legs separately. They must stay the same
// hue (one bot, one identity) while remaining tellable apart, so the second
// leg is the same colour mixed toward white rather than a different one.
function botLighten(id, f) {
  const c = botColor(id).replace('#', '');
  const m = i => Math.round(parseInt(c.substr(i, 2), 16) * (1 - f) + 255 * f);
  return '#' + [0, 2, 4].map(i => m(i).toString(16).padStart(2, '0')).join('');
}

const h = (tag, cls, html) => {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (html !== undefined) el.innerHTML = html;
  return el;
};

function sym(currency) { return currency === 'KRW' ? '₩' : '$'; }

function fmtVal(v, currency) {
  if (currency === 'KRW') return '₩' + Math.round(v).toLocaleString();
  return '$' + v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function fmtPnl(v, currency) {
  const s = currency === 'KRW'
    ? '₩' + (v >= 0 ? '+' : '') + Math.round(v).toLocaleString()
    : '$' + (v >= 0 ? '+' : '') + v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  return s;
}

function pnlClass(v) { return v >= 0 ? 'up' : 'dn'; }

// Whole-won, no decimals. Was defined identically inside allocatorFrameNote()
// and buildAllocation(); fundingBlock() needed a third copy, which is the
// point at which a duplicated one-liner becomes a rule with three homes.
function won(v) { return '₩' + Math.round(v || 0).toLocaleString(); }

// Realized YTD cell — only rendered when the bot has closed at least one trade YTD.
// Intentionally silent on zero-trade bots so cards don't fill with meaningless zeros.
// ── Card metrics: one shape for every bot ─────────────────────────────────
// Every card reports the SAME core fields in the SAME order, Invested → Win Rate,
// so you can read across bots without relearning each layout. These blocks used
// to be hand-written per bot and had drifted apart: korea_etf slipped "Target"
// into the middle of the run, nmf2 put Market Value third and skipped three
// fields, and every cell vanished outright whenever its data was missing — so
// no two cards had the same shape and a gap looked like a different bot.
//
// Missing DATA now renders as an em dash: the field stays in place, it simply
// has no value yet. A field a bot structurally CANNOT have is declared in
// `omit` and left out entirely — the hands-on sleeve has no win rate because
// nobody trades it on a schedule, and a permanent "—" there would read as a
// broken feed rather than as "not applicable".
//
// Bot-specific fields are appended AFTER the core run, never interleaved.
const MDASH = '<span style="color:var(--tx4)">—</span>';

function mCell(lbl, val, cls) {
  return '<div><div class="sg-lbl">' + lbl + '</div><div class="sg-val ' +
         (cls || '') + '">' + val + '</div></div>';
}
function mSub(t) {
  return ' <span style="color:var(--tx4);font-size:0.6rem">' + t + '</span>';
}
function nil(v) { return v === null || v === undefined; }

function mSep(label) {
  return '<div class="sg-sep">' + label + '</div>';
}

function coreMetrics(d) {
  const cur = d.cur || 'KRW';
  const p = d.prefix ? d.prefix + ' ' : '';
  const omit = d.omit || [];
  const on = k => omit.indexOf(k) < 0;
  let o = '';

  if (on('invested')) {
    const pct = (!nil(d.invested) && d.budget > 0)
      ? mSub('(' + Math.round(d.invested / d.budget * 100) + '%)') : '';
    o += mCell(p + 'Invested', nil(d.invested) ? MDASH : fmtVal(d.invested, cur) + pct);
  }
  if (on('budget')) {
    o += mCell(p + 'Budget Cap', d.budgetLabel ||
      (nil(d.budget) || d.budget <= 0 ? MDASH : fmtVal(d.budget, cur)));
  }
  if (on('value')) {
    o += mCell(p + 'Market Value', nil(d.value) ? MDASH : fmtVal(d.value, cur));
  }
  if (on('unrealized')) {
    o += mCell(p + 'Unrealized', nil(d.unrealized) ? MDASH : fmtPnl(d.unrealized, cur),
               nil(d.unrealized) ? '' : pnlClass(d.unrealized));
  }
  if (on('realized')) {
    const t = d.trades || 0;
    o += mCell(p + 'Realized YTD',
      // "(18t)", not "(18 trades)": the long form wraps inside its cell and
      // makes that one cell two lines tall, so the metric row grows and stops
      // lining up with the card above it. Matches the "(18c)" cycle style.
      nil(d.realized) ? MDASH : fmtPnl(d.realized, cur) +
        (t ? mSub('(' + t + 't)') : ''),
      nil(d.realized) ? '' : pnlClass(d.realized));
  }
  if (on('totalPl')) {
    o += mCell(p + 'Total P/L', nil(d.totalPl) ? MDASH : fmtPnl(d.totalPl, cur),
               nil(d.totalPl) ? '' : pnlClass(d.totalPl));
  }
  if (on('profitPct')) {
    // Say what the rate is a rate OF. Most bots divide by their allocated
    // budget; a bot with no budget (btc_vb runs uncapped on the Upbit balance)
    // divides by capital deployed. Different denominators, not comparable.
    const basisTag = (!nil(d.profitPct) && d.basis === 'deployed')
      ? mSub('(on deployed)') : '';
    o += mCell(p + 'Profit %', nil(d.profitPct) ? MDASH :
      (d.profitPct >= 0 ? '+' : '') + d.profitPct.toFixed(2) + '%' + basisTag,
      nil(d.profitPct) ? '' : pnlClass(d.profitPct));
  }
  if (on('winRate')) {
    // The cycle count rides HERE, as "(30c)". There used to be a separate
    // Cycles cell carrying the same integer one column later; on seven of the
    // eight cards it was a verbatim duplicate, and on the eighth it read "0"
    // next to a win rate already dashed out for having no closed trades.
    o += mCell(p + 'Win Rate', nil(d.winRate) ? MDASH :
      d.winRate.toFixed(1) + '%' + mSub('(' + (d.cycles || 0) + 'c)'));
  }
  return o;
}

// MDD is not rendered. No bot has ever published `mdd_pct` — it is null for
// all ten entities in every payload the generator produces — so the cell was a
// permanent em dash on every card, twice on Hybrid VB. This file's own rule is
// that a field which is structurally absent gets dropped rather than dashed,
// because a standing "—" reads as a feed that broke. If a bot starts reporting
// drawdown, add the cell back here and it re-joins the fixed run.


// The per-metric cell helpers that used to live here (realizedCell,
// totalPlCell, profitPctCell, winRateCell, mddCell, cyclesCell) are gone.
// coreMetrics() renders the same fields in a fixed order for every bot, and
// keeping the old helpers around would leave a second way to build a cell
// that silently drifts from the first.

function relTime(ts) {
  if (!ts) return '';
  const d = new Date(ts.replace(' ', 'T'));
  const now = new Date();
  const diff = (now - d) / 1000 / 60;
  if (diff < 60) return Math.round(diff) + 'm ago';
  if (diff < 1440) return Math.round(diff / 60) + 'h ago';
  return Math.round(diff / 1440) + 'd ago';
}

function shortTime(ts) {
  if (!ts) return '';
  // Handle "2026-04-03 09:00:05" format
  const parts = ts.split(' ');
  if (parts.length >= 2) return parts[1].substring(0, 5);
  return ts;
}

// ═══ Sparkline Charts ═════════════════════════════════════
function renderSparkline(series, width = 280, height = 60) {
  // series: [[date, value], ...] — must have >= 2 points
  if (!series || series.length < 2) return '';

  const values = series.map(p => p[1]);
  const dates = series.map(p => p[0]);
  const minV = Math.min(...values);
  const maxV = Math.max(...values);
  const range = maxV - minV || 1;
  const pad = 2;

  const points = values.map((v, i) => {
    const x = pad + (i / (values.length - 1)) * (width - pad * 2);
    const y = pad + (1 - (v - minV) / range) * (height - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });

  const firstVal = values[0];
  const lastVal = values[values.length - 1];
  const pctChange = firstVal !== 0 ? ((lastVal / firstVal - 1) * 100) : 0;
  const color = pctChange >= 0 ? 'var(--g)' : 'var(--r)';
  const fillColor = pctChange >= 0 ? 'var(--g-bg)' : 'var(--r-bg)';

  // Create gradient fill path
  const fillPoints = `${pad},${height - pad} ${points.join(' ')} ${width - pad},${height - pad}`;

  const startLabel = dates[0].substring(5); // MM-DD
  const endLabel = dates[dates.length - 1].substring(5);

  return `
    <div class="sparkline-wrap">
      <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" class="sparkline-svg">
        <polygon points="${fillPoints}" fill="${fillColor}" />
        <polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" />
        <circle cx="${points[points.length - 1].split(',')[0]}" cy="${points[points.length - 1].split(',')[1]}" r="2.5" fill="${color}" />
      </svg>
      <div class="sparkline-meta">
        <span>${startLabel}</span>
        <span class="${pctChange >= 0 ? 'up' : 'dn'}">${pctChange >= 0 ? '+' : ''}${pctChange.toFixed(1)}%</span>
        <span>${endLabel}</span>
      </div>
    </div>
  `;
}

// ═══ Render ═══════════════════════════════════════════════
// ═══ Strategy Comparison Chart ═══════════════════════════
// Plots each bot's YTD Total P/L (realized + unrealized accrued daily) in KRW,
// plus a bold "Portfolio Total" overlay summing all bots per date.
function buildComparisonChart(equitySeries, aggregateSeries, strategies) {
  const seriesMeta = {
    // color comes from botColor() below — this table only maps series to bots.
    btc_vb:        { name: 'BTC Volatility Breakout', stratId: 'btc_vb' },
    korea_etf:     { name: 'Korea ETF Momentum',      stratId: 'korea_etf' },
    quant40:       { name: 'US Quant40',              stratId: 'quant40' },
    jd_strategy:   { name: 'JD Strategy',             stratId: 'jd_strategy' },
    dual_momentum: { name: 'Dual Momentum',           stratId: 'dual_momentum' },
    claude_bot:    { name: 'Claude Trading Bot',      stratId: 'claude_bot' },
    // Toss-account bot. Its P/L runs at a ~W50k scale against the others' millions,
    // so the line hugs zero — that is honest for a W1M sleeve, not a bug.
    nmf2:          { name: 'NMF2 (신마법공식 2.0)',     stratId: 'nmf2' },
    hybrid_vb_kr:  { name: 'Hybrid VB (KR)',          stratId: 'hybrid_vb',     sub: 'kr' },
    hybrid_vb_us:  { name: 'Hybrid VB (US)',          stratId: 'hybrid_vb',     sub: 'us' },
  };

  const stratIndex = {};
  (strategies || []).forEach(s => { stratIndex[s.id] = s; });

  const allDates = new Set();
  const prepared = Object.keys(seriesMeta).map(key => {
    const meta = seriesMeta[key];
    const raw = (equitySeries || {})[key] || [];
    const strat = stratIndex[meta.stratId] || {};
    const sub = meta.sub ? (strat[meta.sub] || {}) : strat;
    const wr = sub.win_rate_pct;
    const cycles = sub.cycles_ytd;
    const entry = {
      key, name: meta.name,
      color: meta.sub === 'us' ? botLighten(meta.stratId, 0.4) : botColor(meta.stratId),
      wr, cycles, points: [], finalVal: null, insufficient: false,
      isPortfolio: false,
    };
    if (raw.length < 2) {
      entry.insufficient = true;
      return entry;
    }
    raw.forEach(([date, val]) => {
      entry.points.push({ date, val });
      allDates.add(date);
    });
    entry.finalVal = entry.points[entry.points.length - 1].val;
    return entry;
  });

  // Portfolio Total — sum of all bots' total P/L per date, drawn last so it
  // sits on top of per-bot lines.
  const portfolioRaw = (aggregateSeries || {}).total || [];
  if (portfolioRaw.length >= 2) {
    const portEntry = {
      key: 'portfolio', name: 'Portfolio Total', color: 'var(--tx)',
      wr: null, cycles: null, points: [], finalVal: null, insufficient: false,
      isPortfolio: true,
    };
    portfolioRaw.forEach(([date, val]) => {
      portEntry.points.push({ date, val });
      allDates.add(date);
    });
    portEntry.finalVal = portEntry.points[portEntry.points.length - 1].val;
    prepared.push(portEntry);
  }

  const dateList = [...allDates].sort();
  if (dateList.length < 2) return null;
  const dateToIdx = {};
  dateList.forEach((d, i) => { dateToIdx[d] = i; });

  let minY = 0, maxY = 0;
  prepared.forEach(p => {
    if (p.insufficient) return;
    p.points.forEach(pt => {
      if (pt.val < minY) minY = pt.val;
      if (pt.val > maxY) maxY = pt.val;
    });
  });
  // Always include zero so positive/negative are both visible against the axis.
  if (minY > 0) minY = 0;
  if (maxY < 0) maxY = 0;
  const padY = ((maxY - minY) || 100000) * 0.08;
  const yLo = minY - padY;
  const yHi = maxY + padY;

  // SVG uses an internal 1000x1000 coordinate space; CSS stretches it to fill
  // the .cmp-plot box. vector-effect="non-scaling-stroke" keeps line weight
  // consistent under non-uniform scaling.
  const VB = 1000;
  const xFor = (idx) => (idx / (dateList.length - 1)) * VB;
  const yFor = (val) => (1 - (val - yLo) / (yHi - yLo)) * VB;

  const zeroLine = (yLo <= 0 && yHi >= 0)
    ? `<line x1="0" y1="${yFor(0).toFixed(1)}" x2="${VB}" y2="${yFor(0).toFixed(1)}" stroke="var(--tx4)" stroke-width="0.5" stroke-dasharray="4,4" vector-effect="non-scaling-stroke"/>`
    : '';

  const linesSvg = prepared.filter(p => !p.insufficient).map(p => {
    const pts = p.points.map(pt => `${xFor(dateToIdx[pt.date]).toFixed(1)},${yFor(pt.val).toFixed(1)}`).join(' ');
    const sw = p.isPortfolio ? 2.5 : 1.5;
    return `<polyline data-key="${p.key}" points="${pts}" fill="none" stroke="${p.color}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  }).join('');

  const cursor = `<line class="cmp-cursor" x1="0" y1="0" x2="0" y2="${VB}" stroke="var(--tx2)" stroke-width="0.5" stroke-dasharray="3,3" vector-effect="non-scaling-stroke" style="display:none"/>`;
  const overlay = `<rect class="cmp-overlay" x="0" y="0" width="${VB}" height="${VB}" fill="transparent" pointer-events="all"/>`;

  // KRW formatter: ₩+50K / ₩+1.2M / ₩-3K — compact, signed, never floats.
  const fmtKrw = (v) => {
    const sign = v >= 0 ? '+' : '−';
    const a = Math.abs(v);
    if (a >= 1e6) return '₩' + sign + (a / 1e6).toFixed(1) + 'M';
    if (a >= 1e3) return '₩' + sign + Math.round(a / 1e3) + 'K';
    return '₩' + sign + Math.round(a);
  };

  // Y-axis labels: top, zero (if in range), bottom.
  const yLabels = [];
  yLabels.push({ val: yHi, top: 0 });
  if (yLo < 0 && yHi > 0) yLabels.push({ val: 0, top: ((yHi - 0) / (yHi - yLo)) * 100 });
  yLabels.push({ val: yLo, top: 100 });
  const yAxisHTML = yLabels.map(l =>
    `<span style="top:${l.top.toFixed(2)}%">${fmtKrw(l.val)}</span>`
  ).join('');

  // X-axis: 4-5 evenly spaced date ticks (MM-DD).
  const tickCount = Math.min(5, dateList.length);
  const tickIdxs = [];
  for (let i = 0; i < tickCount; i++) {
    tickIdxs.push(Math.round(i * (dateList.length - 1) / (tickCount - 1)));
  }
  const xAxisHTML = [...new Set(tickIdxs)].map(i => {
    const left = (i / (dateList.length - 1)) * 100;
    return `<span style="left:${left.toFixed(2)}%">${dateList[i].substring(5)}</span>`;
  }).join('');

  // Legend: portfolio sum pinned to top, then per-bot by final value desc;
  // insufficient-data rows pinned to bottom.
  const sorted = [...prepared].sort((a, b) => {
    if (a.isPortfolio !== b.isPortfolio) return a.isPortfolio ? -1 : 1;
    if (a.insufficient !== b.insufficient) return a.insufficient ? 1 : -1;
    if (a.insufficient) return 0;
    return b.finalVal - a.finalVal;
  });
  const legendHTML = sorted.map(p => {
    if (p.insufficient) {
      return `<div class="cmp-legend-row"><span class="cmp-swatch" style="background:${p.color}"></span><span class="cmp-name">${p.name}</span><span class="cmp-detail">— insufficient data</span></div>`;
    }
    const valStr = fmtKrw(p.finalVal);
    const valCls = p.finalVal >= 0 ? 'up' : 'dn';
    if (p.isPortfolio) {
      return `<div class="cmp-legend-row" style="font-weight:600;border-bottom:1px solid var(--border);padding-bottom:0.4rem;margin-bottom:0.2rem"><span class="cmp-swatch" style="background:${p.color}"></span><span class="cmp-name">${p.name}</span><span class="cmp-pct ${valCls}">${valStr}</span></div>`;
    }
    const wrPart = (p.wr === null || p.wr === undefined) ? '' : `, ${p.wr.toFixed(0)}% WR`;
    const metaStr = `(${p.cycles || 0}c${wrPart})`;
    return `<div class="cmp-legend-row"><span class="cmp-swatch" style="background:${p.color}"></span><span class="cmp-name">${p.name}</span><span class="cmp-pct ${valCls}">${valStr}</span><span class="cmp-meta">${metaStr}</span></div>`;
  }).join('');

  const section = h('section', 'cmp fade-in d1');
  section.innerHTML = `
    <div class="cmp-hdr">
      <h2 class="cmp-title">Strategy Comparison · 2026 YTD</h2>
      <div class="cmp-sub">Total P/L per bot (realized + unrealized accrued) + portfolio sum, in KRW</div>
    </div>
    <div class="cmp-chart">
      <div class="cmp-y-axis">${yAxisHTML}</div>
      <div class="cmp-plot">
        <svg class="cmp-svg" viewBox="0 0 ${VB} ${VB}" preserveAspectRatio="none">
          ${zeroLine}
          ${linesSvg}
          ${cursor}
          ${overlay}
        </svg>
        <div class="cmp-x-axis">${xAxisHTML}</div>
        <div class="cmp-tooltip" style="display:none"></div>
      </div>
    </div>
    <div class="cmp-legend">${legendHTML}</div>
  `;

  // Hover: snap a vertical cursor to the nearest unified date and show a
  // tooltip listing each bot that has a sample on that date.
  const svgEl = section.querySelector('.cmp-svg');
  const overlayEl = section.querySelector('.cmp-overlay');
  const cursorEl = section.querySelector('.cmp-cursor');
  const tooltipEl = section.querySelector('.cmp-tooltip');
  const plotEl = section.querySelector('.cmp-plot');

  overlayEl.addEventListener('mousemove', (e) => {
    const rect = svgEl.getBoundingClientRect();
    if (!rect.width) return;
    const xVB = (e.clientX - rect.left) / rect.width * VB;
    let nearestIdx = 0, nearestDist = Infinity;
    for (let i = 0; i < dateList.length; i++) {
      const px = xFor(i);
      const d = Math.abs(px - xVB);
      if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
    }
    const date = dateList[nearestIdx];
    const cursorX = xFor(nearestIdx);
    cursorEl.setAttribute('x1', cursorX);
    cursorEl.setAttribute('x2', cursorX);
    cursorEl.style.display = '';

    const rows = prepared
      .filter(p => !p.insufficient)
      .map(p => {
        const pt = p.points.find(x => x.date === date);
        if (!pt) return null;
        return { name: p.name, color: p.color, val: pt.val };
      })
      .filter(Boolean)
      .sort((a, b) => b.val - a.val);

    if (!rows.length) {
      tooltipEl.style.display = 'none';
      return;
    }

    tooltipEl.innerHTML = `<div class="cmp-tt-date">${date}</div>` + rows.map(r => {
      return `<div class="cmp-tt-row"><span class="cmp-swatch" style="background:${r.color}"></span><span>${r.name}</span><span class="cmp-tt-pct ${r.val >= 0 ? 'up' : 'dn'}">${fmtKrw(r.val)}</span></div>`;
    }).join('');

    const plotRect = plotEl.getBoundingClientRect();
    const cursorPx = (cursorX / VB) * rect.width + (rect.left - plotRect.left);
    tooltipEl.style.display = '';
    const ttW = tooltipEl.offsetWidth;
    const overflowsRight = cursorPx + 12 + ttW > plotRect.width - 4;
    tooltipEl.style.left = (overflowsRight ? cursorPx - ttW - 12 : cursorPx + 12) + 'px';
  });

  overlayEl.addEventListener('mouseleave', () => {
    cursorEl.style.display = 'none';
    tooltipEl.style.display = 'none';
  });

  return section;
}

// ═══ Render ═══════════════════════════════════════════════

// ── Asset allocation panel ────────────────────────────────────────────────
// Renders the three-level policy the allocator actually ran, straight from the
// proposal it wrote. Deliberately shows WHICH constraint bound X: kelly, the
// vol cap, the cash floor and the drawdown brake all produce a single number,
// and that number means very different things depending on which one won.
// The allocator sized the bots from ITS OWN snapshot, hours before this page
// was built. Usually the gap is just FX and intraday drift and is not worth a
// sentence. When the HANDS-ON figure differs materially it is worth a loud one:
// residual = capital − hands-on, so an overstated sleeve understates the
// residual and every bot is sized low. That is exactly what happened on
// 2026-08-20, when collect.py read a dashboard whose Toss sleeve was a day old.
function allocatorFrameNote(a) {
  const f = a.allocator_frame || {};
  if (!f.capital_krw) return '';

  const manGap = (a.level0.manual_krw || 0) - (f.manual_krw || 0);
  const rel = f.manual_krw ? Math.abs(manGap) / f.manual_krw : 0;
  let s = '<div class="alloc-note">Figures above are priced now, so this Total ' +
    'capital matches the headline at the top of the page. When it sized these bots at ' +
    (a.capital_as_of || 'its last run') + ' the allocator saw capital ' +
    won(f.capital_krw) + ' and hands-on ' + won(f.manual_krw) +
    ' at FX ' + Math.round(f.fx || 0).toLocaleString() + ', giving residual ' +
    won(f.residual_krw) + '.';

  if (rel > 0.02) {
    s += ' <b>Its hands-on figure was off by ' + won(Math.abs(manGap)) +
      (manGap < 0 ? ' (too high)' : ' (too low)') + '</b> — residual is capital minus ' +
      'hands-on, so the fleet was sized off a residual that was ' +
      (manGap < 0 ? 'understated' : 'overstated') +
      ' by the same amount. Today\'s targets carry that error until the next run.';
  }
  return s + '</div>';
}

// Budget − Held: what this bot is allowed to put to work and has not.
// Null-safe — event_bot publishes no card, so it has no Held at all.
function headroom(b) {
  if (b.held_krw == null) return 0;
  return Math.max(0, (b.current_krw || 0) - b.held_krw);
}

// ── Funding: a budget is only real if the ACCOUNT holds the cash ──────────
//
// This block exists because the table above cannot be read honestly without
// it. `allocate.py` sizes every bot from TOTAL capital across all four
// brokers, but a bot can only ever spend cash sitting in its own account, and
// nothing in the allocator moves money between brokers. So the six KIS bots
// were carrying ₩221,031,107 of budget against a KIS account holding
// ₩124,939,554 — of which only ₩8,540,307 was cash. Their headroom is not
// something the fleet can grow into; it is a transfer request nobody had
// written down.
//
// Per bot the gap is just headroom. Per ACCOUNT it is the actionable number,
// because cash is pooled per account and the shortfall is what a human has to
// move. Hence: sum the budgets and holdings per account, set them against
// that account's own cash, and name the shortfall.
function fundingBlock(inFleet, accounts) {
  if (!accounts) return '';
  const acc = {};
  inFleet.forEach(b => {
    // "kis_us" / "kis_kr" are one brokerage account with one cash pool.
    const key = String(b.account || '').split('_')[0];
    if (!key) return;
    const r = acc[key] || (acc[key] = { budget: 0, held: 0 });
    r.budget += b.current_krw || 0;
    r.held += b.held_krw || 0;
  });
  const keys = Object.keys(acc).filter(k => accounts[k]);
  if (!keys.length) return '';

  let anyShort = false;
  const rows = keys.map(k => {
    const r = acc[k];
    const cash = (accounts[k] || {}).cash_krw || 0;
    const head = Math.max(0, r.budget - r.held);
    const short = Math.max(0, head - cash);
    if (short > 0) anyShort = true;
    return '<tr><td>' + k.toUpperCase() + '</td>' +
      '<td>' + won(r.budget) + '</td>' +
      '<td class="dim">' + won(r.held) + '</td>' +
      '<td class="' + (head > 0 ? 'gap' : 'dim') + '">' + (head > 0 ? won(head) : '—') + '</td>' +
      '<td class="dim">' + won(cash) + '</td>' +
      '<td class="' + (short > 0 ? 'short' : 'dim') + '">' +
        (short > 0 ? won(short) : 'funded') + '</td></tr>';
  }).join('');

  // Where the money actually is. Idle cash in an account NO bot draws on is
  // the answer to the shortfall, so name it rather than making him hunt.
  const idle = Object.keys(accounts)
    .filter(k => !acc[k] && ((accounts[k] || {}).cash_krw || 0) > 0)
    .map(k => k.toUpperCase() + ' ' + won(accounts[k].cash_krw));

  let note = '<b>Headroom</b> is Budget − Held: what the allocator permits and ' +
    'the bot has not deployed. It is only spendable if that account is holding ' +
    'the cash — the allocator sizes bots against total capital across all four ' +
    'brokers, and it cannot move money between them. <b>To fund</b> is the ' +
    'shortfall a transfer has to cover before those budgets mean anything.';
  if (idle.length) {
    note += ' Cash currently sitting where no bot can reach it: <b>' +
      idle.join('</b>, <b>') + '</b>.';
  }
  if (!anyShort) {
    note += ' Every account can currently cover its own headroom.';
  }
  // Fleet bots only. The bots outside the fleet either hold a budget that IS
  // their account balance (btc_vb on Upbit — counting it would double-count
  // the account against itself) or are unfunded paper. The one real omission
  // is the USVB sleeve, so name it rather than let these totals read as the
  // whole story.
  note += ' Fleet bots only — the USVB sleeve\'s budget is not included here, ' +
    'and btc_vb is excluded because its budget IS the Upbit balance.';

  return '<div class="fund">' +
    '<div class="fund-hd">Funding · a budget is only real if the account holds the cash</div>' +
    '<table class="alloc-tbl"><thead><tr>' +
    '<th>Account</th><th>Budgeted</th><th>Held</th><th>Headroom</th>' +
    '<th>Cash on hand</th><th>To fund</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="alloc-note">' + note + '</div></div>';
}

function buildAllocation(a, accounts) {
  if (!a) return null;
  const L0 = a.level0 || {}, L1 = a.level1 || {}, L2 = a.level2 || {};
  const pc = v => (v === null || v === undefined) ? '—' : (v * 100).toFixed(0) + '%';

  const sec = h('section', 'alloc fade-in d1');

  let badge = a.applied
    ? '<span class="alloc-badge ok">Applied</span>'
    : '<span class="alloc-badge warn">Proposed only</span>';
  if (a.stale) badge += ' <span class="alloc-badge warn">Stale</span>';
  const when = (a.applied_at || a.as_of || '').replace('T', ' ').slice(0, 16);
  const age = (a.age_hours === null || a.age_hours === undefined)
    ? '' : ' · ' + a.age_hours.toFixed(1) + 'h ago';

  const hd = h('div', 'alloc-hd');
  hd.innerHTML =
    '<h2>Asset Allocation</h2>' +
    '<div class="meta">' + badge + ' <span>' + when + age +
    (a.policy_version ? ' · ' + a.policy_version : '') + '</span></div>';
  sec.appendChild(hd);

  // Which constraint set X. The allocator emits these exact strings.
  const BIND = {
    kelly: 'half-Kelly', cash_floor: 'cash floor',
    vol_target: 'volatility cap', X_MIN: 'governance floor',
  };
  const bindName = BIND[L1.binding] || (L1.binding || '—');
  const mark = key => L1.binding === key ? ' <b class="bind">← binds</b>' : '';

  // The panel is priced in the dashboard's frame now, so this line must say so.
  // It used to read "measured <allocator time>", which was true of the old
  // behaviour and became a lie the moment the figures were re-priced live.
  const capMeta = (a.repriced_live ? 'priced now, same as Total Capital above' :
                   (a.capital_as_of ? 'allocator frame, measured ' + a.capital_as_of : '')) +
    (a.fx ? ' · FX ' + Math.round(a.fx).toLocaleString() : '');

  const levels = h('div', 'alloc-levels');
  levels.innerHTML =
    '<div class="alloc-lv">' +
      '<div class="lv-tag">Level 0 · total capital</div>' +
      '<div class="lv-sub">Everything under management, across every account.</div>' +
      '<div class="alloc-row big eq"><span class="k">Total capital</span><span class="v">' + won(a.capital_krw) + '</span></div>' +
      '<div class="alloc-row"><span class="k">of which hands-on</span><span class="v">' + won(L0.manual_krw) + '</span></div>' +
      '<div class="alloc-row"><span class="k">not in hands-on</span><span class="v">' + won(L0.residual_krw) + '</span></div>' +
      (capMeta ? '<div class="lv-foot">' + capMeta + '</div>' : '') +
    '</div>' +
    '<div class="alloc-lv">' +
      '<div class="lv-tag">Level 1 · one system exposure</div>' +
      '<div class="lv-sub">X = min(half-Kelly, cash floor, vol cap) × DD brake. One number for the whole fleet, not per bot.</div>' +
      '<div class="alloc-row"><span class="k">half-Kelly' + mark('kelly') + '</span><span class="v">' + pc(L1.kelly_half) + '</span></div>' +
      '<div class="alloc-row"><span class="k">cash floor' + mark('cash_floor') + '</span><span class="v">80%</span></div>' +
      '<div class="alloc-row"><span class="k">vol cap' + mark('vol_target') + '</span><span class="v">' + pc(L1.x_vol_cap) + '</span></div>' +
      '<div class="alloc-row"><span class="k">× DD brake</span><span class="v">' + (L1.brake == null ? '—' : L1.brake.toFixed(2)) + '</span></div>' +
      '<div class="alloc-row big eq"><span class="k">= X</span><span class="v">' + pc(L1.X) + '</span></div>' +
      '<div class="lv-foot">' + won(a.capital_krw) + ' × ' + pc(L1.X) + ' = <b>' +
        won(L2.exposure_budget_krw) + '</b> exposure budget — the total the system is ' +
        'willing to have at risk, hands-on included.</div>' +
    '</div>' +
    '<div class="alloc-lv">' +
      '<div class="lv-tag">Level 2 · hands-on comes out, then 1/N</div>' +
      '<div class="lv-sub">Hands-on is senior AND counts inside X — it is exposure too. Deducting it here is what keeps total exposure at X and the cash floor intact.</div>' +
      '<div class="alloc-row"><span class="k">Exposure budget</span><span class="v">' + won(L2.exposure_budget_krw) + '</span></div>' +
      '<div class="alloc-row minus"><span class="k">− Hands-on</span><span class="v">' + won(L0.manual_krw) + '</span></div>' +
      '<div class="alloc-row eq"><span class="k">= Fleet pool</span><span class="v">' + won(L2.fleet_pool_krw) + '</span></div>' +
      '<div class="alloc-row minus"><span class="k">÷ bots in fleet (N)</span><span class="v">' + (L2.N || 0) + '</span></div>' +
      '<div class="alloc-row big"><span class="k">= 1/N share</span><span class="v">' + won(L2.per_bot_krw) + '</span></div>' +
      (L2.fleet_recalled
        ? '<div class="lv-foot"><b>Hands-on alone exceeds the exposure budget</b> — at this X the fleet is recalled to zero. A change that large is held for approval, not auto-applied.</div>'
        : '<div class="lv-foot">Total exposure = hands-on + fleet pool = <b>' + pc(L1.X) +
          '</b> of capital, so the ' + pc(1 - (L1.X || 0)) + ' cash floor holds.</div>') +
    '</div>';
  sec.appendChild(levels);

  const inFleet = (a.bots || []).filter(b => b.in_etf);
  const out = (a.bots || []).filter(b => !b.in_etf);
  if (inFleet.length || out.length) {
    // The ramp factor is derived from the data (target ÷ current), never
    // hard-coded here — a constant copied into the UI is a constant that drifts
    // from the allocator the first time someone tunes AM_RAMP_MAX.
    const ramped = inFleet.filter(b => b.limited_by === 'ramp' && b.ramp_factor);
    const factor = ramped.length ? ramped[0].ramp_factor : null;
    const runs = ramped.length
      ? Math.max.apply(null, ramped.map(b => b.runs_to_target || 0)) : 0;

    const limitCell = b => {
      if (b.limited_by === 'ramp') {
        return '<span class="lim">ramp ×' + (b.ramp_factor || 0).toFixed(2) + '</span>';
      }
      // NOT "held · band". There is a column called Held two cells to the
      // left meaning "market value of positions", and this cell meant
      // "budget held at its current value" — the same word for two unrelated
      // things, on one row.
      if (b.limited_by === 'band') return '<span class="lim">band · no change</span>';
      return '<span class="why">at 1/N</span>';
    };

    const rows = inFleet.map(b =>
      '<tr><td><span class="alloc-dot" style="background:' + botColor(b.id) +
      '"></span>' + b.name + '</td>' +
      '<td class="why">' + (b.account || '') + '</td>' +
      '<td>' + won(b.current_krw) + '</td>' +
      '<td class="dim">' + (b.held_krw == null ? '—' : won(b.held_krw)) + '</td>' +
      '<td class="' + (headroom(b) > 0 ? 'gap' : 'dim') + '">' +
        (b.held_krw == null ? '—' : (headroom(b) > 0 ? won(headroom(b)) : '—')) + '</td>' +
      '<td>' + limitCell(b) + '</td></tr>'
    ).join('') + out.map(b =>
      '<tr class="out"><td><span class="alloc-dot" style="background:' +
      botColor(b.id) + '"></span>' + b.name + '</td>' +
      '<td class="why">' + (b.account || '') + '</td>' +
      '<td>' + won(b.current_krw) + '</td>' +
      '<td class="dim">' + (b.held_krw == null ? '—' : won(b.held_krw)) + '</td>' +
      '<td colspan="2" class="why">' + (b.why || 'excluded') + '</td></tr>'
    ).join('');

    // The old note read "Drift is target − current" — and `current` had
    // already been renamed to Budget, so the legend explained the table using
    // a word that appeared nowhere in it.
    let note = '<b>Budget</b> is the ceiling apply.py last wrote; a bot picks it ' +
      'up on its next run, so its own card can lag it. <b>Held</b> is the market ' +
      'value of what it is holding right now. The budget is recomputed from the ' +
      'residual as it stands, so reducing hands-on capital lifts it the moment it ' +
      'happens. ';
    if (factor) {
      note += 'Today\'s target is still capped at <b>×' + factor.toFixed(2) +
        ' per daily run</b> — a jump straight to 1/N would have the fleet chasing ' +
        'every manual trade — so freed capital arrives over the next ' +
        (runs ? '<b>' + runs + ' run' + (runs === 1 ? '' : 's') + '</b>' : 'few runs') +
        ' rather than at once. ';
    }
    note += 'A bot already within 20% of its 1/N share keeps the budget it has, ' +
            'so a small move does not churn the book — that is what ' +
            '<b>band · no change</b> means in the last column, and it is about ' +
            'the BUDGET, not about the holdings. The gap between Budget and Held ' +
            'is the bot\'s <b>headroom</b>, and closing it needs cash in that ' +
            'account, not a change here — see Funding below.';

    const tbl = h('div', 'alloc-bots');
    tbl.innerHTML =
      // Three columns were removed because they carried no information the
      // reader could act on:
      //   1/N share — pool ÷ N, one number by construction, identical on all
      //               seven fleet rows and already stated once in Level 2;
      //   Target    — the SAME QUANTITY as Budget. Target is what the rule
      //               computes now, Budget is what apply.py last wrote; they
      //               differ only in the hours between a recompute and the
      //               next run, and they were equal on every row. Two columns
      //               for one meaning is what made this table unreadable.
      //   Drift     — Target − Budget, so it was ₩+0 on every row, printed in
      //               P/L green. It read as "this bot is where it should be"
      //               directly beside a bot holding ₩6.1M of a ₩36.9M budget.
      // Headroom (Budget − Held) replaces them: the one gap that is real and
      // the only one anybody can close.
      '<table class="alloc-tbl"><thead><tr>' +
      '<th>Bot</th><th>Account</th><th>Budget</th><th>Held</th>' +
      '<th>Headroom</th><th>Limited by</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
      // Legend before Funding: it ends with "see Funding below", which was a
      // lie about its own position — the block was being emitted first.
      '<div class="alloc-note">' + note + '</div>' +
      fundingBlock(inFleet, accounts) +
      allocatorFrameNote(a);
    sec.appendChild(tbl);
  }
  return sec;
}


function render(data) {
  // Adopt the generator's palette; the literal above is only a fallback.
  if (data.bot_colors) {
    BOT_COLORS = Object.fromEntries(
      Object.entries(data.bot_colors).map(([k, v]) => [k, v.hex || v]));
  }
  const app = $('#app');
  app.innerHTML = '';

  // ── Header
  const hdr = h('header', 'hdr fade-in');
  hdr.innerHTML = `
    <h1>Automation <em>Oracle</em></h1>
    <div class="hdr-right">
      <span class="hdr-meta"><span class="live-dot"></span>${data.strategies.filter(s => s.id !== 'manual').length} strategies</span>
      <span class="hdr-meta">${data.meta.kst}</span>
      <a class="refresh-btn" href="decision.html" style="text-decoration:none">→ Decision Center</a>
      <button class="refresh-btn" onclick="load()">Refresh</button>
    </div>
  `;
  app.appendChild(hdr);

  // ── Account-level data (from generate_dashboard_data.py → KIS API query)
  const portfolio = data.portfolio || {};
  const totalAsset = portfolio.total_value_krw || 0;
  const cashKRW = portfolio.cash_krw || 0;
  const cashUSD = portfolio.cash_usd || 0;
  const upbitKRW = portfolio.upbit_krw || 0;
  const exchangeRate = portfolio.exchange_rate || 1380;

  // ── Sum realized + unrealized from all bots (per-currency)
  let unrealKRW = 0, unrealUSD = 0;
  let realKRW = 0,   realUSD = 0;
  data.strategies.forEach(s => {
    if (s.currency === 'KRW') {
      unrealKRW += (s.unrealized_profit ?? s.profit ?? 0);
      realKRW   += (s.realized_profit_ytd || 0);
    } else if (s.currency === 'USD') {
      unrealUSD += (s.unrealized_profit ?? s.profit ?? 0);
      realUSD   += (s.realized_profit_ytd || 0);
    } else if (s.currency === 'MULTI') {
      unrealKRW += (s.kr?.unrealized_profit ?? s.kr?.profit ?? 0);
      unrealUSD += (s.us?.unrealized_profit ?? s.us?.profit ?? 0);
      realKRW   += (s.kr?.realized_profit_ytd || 0);
      realUSD   += (s.us?.realized_profit_ytd || 0);
    }
  });
  const unrealCombined = unrealKRW + unrealUSD * exchangeRate;
  const realCombined   = realKRW   + realUSD   * exchangeRate;
  const totalPnlCombined = unrealCombined + realCombined;
  const originalDeposit = portfolio.original_deposit_krw || 1;
  const totalPnlPct = originalDeposit > 0 ? (totalPnlCombined / originalDeposit * 100) : 0;

  // ── Total-Capital hero
  // Jae runs most of his money by hand, in front of the bots, and it lives in
  // three brokers. The strip below only ever knew about KIS + Upbit; this block
  // is the honest headline: KIS + Upbit + Toss, then where that money actually
  // sits (bots / his own hand / cash). Rendered only when the generator supplies
  // the additive `totals` + `accounts` keys, so an older JSON degrades to the
  // pre-existing page instead of showing zeroes.
  const T = data.totals || null;
  const ACCT = data.accounts || {};
  if (T && T.investments_krw > 0) {
    const hero = h('section', 'hero fade-in');
    const invUSD = exchangeRate > 0 ? T.investments_krw / exchangeRate : 0;

    const tile = (key, label) => {
      const a = ACCT[key] || {};
      const val = a.total_krw || 0;
      // A sleeve is greyed when the generator says so OR when it has no money to
      // report — never silently dropped, because a missing tile reads as "I don't
      // have that account" rather than "I couldn't see it today".
      const stale = !!a.stale || !(val > 0);
      let meta;
      if (stale) {
        meta = a.last_seen_at ? 'last seen ' + String(a.last_seen_at).substring(0, 10)
                              : (a.note ? String(a.note).substring(0, 44) : 'no data');
      } else {
        meta = String(a.as_of || '').replace('T', ' ').substring(0, 16);
      }
      return `<div class="hero-acct${stale ? ' stale' : ''}">
        <div class="a-name">${label}${stale ? '<span class="badge-stale">Stale</span>' : ''}</div>
        <div class="a-val">₩${Math.round(val).toLocaleString()}</div>
        <div class="a-meta">${meta}</div>
      </div>`;
    };

    const sp = T.split_pct || {};
    const seg = (pct, color) => (pct > 0)
      ? `<div class="split-seg" style="width:${pct}%;background:${color}"></div>` : '';
    const leg = (color, label, pct, krw) =>
      `<span class="sl"><span class="split-sw" style="background:${color}"></span>` +
      `${label} <b>${(pct || 0).toFixed(1)}%</b> <span style="color:var(--tx3)">₩${Math.round(krw || 0).toLocaleString()}</span></span>`;

    const warn = T.reconciliation_warning
      ? `<div class="recon-warn">⚠ ₩${Math.round(Math.abs(T.reconciliation_gap_krw || 0)).toLocaleString()} of the account totals is unaccounted for (${(T.reconciliation_gap_pct || 0).toFixed(2)}%) — treat the split as approximate.</div>`
      : '';

    hero.innerHTML = `
      <div class="hero-top">
        <div class="hero-lbl">Total Capital</div>
        <div class="hero-val">₩${Math.round(T.investments_krw).toLocaleString()}</div>
        <div class="hero-sub">≈ $${Math.round(invUSD).toLocaleString()} · KIS + CMA + Upbit + Toss</div>
        <div class="hero-pnl ${pnlClass(totalPnlCombined)}">Bot P/L YTD ${fmtPnl(totalPnlCombined, 'KRW')} (${totalPnlPct >= 0 ? '+' : ''}${totalPnlPct.toFixed(2)}% of deposits)</div>
      </div>
      <div class="hero-accts">
        ${tile('kis', 'KIS')}${tile('cma', 'CMA')}${tile('upbit', 'Upbit')}${tile('toss', 'Toss')}
      </div>
      <div class="hero-split">
        <div class="split-bar">
          ${seg(sp.bots, 'var(--accent)')}${seg(sp.manual, '#8a8a8a')}${seg(sp.cash, 'var(--blue)')}
        </div>
        <div class="split-legend">
          ${leg('var(--accent)', 'Bots', sp.bots, T.bots_krw)}
          ${leg('#8a8a8a', 'Hands-on', sp.manual, T.manual_krw)}
          ${leg('var(--blue)', 'Cash', sp.cash, T.cash_krw)}
        </div>
        ${warn}
      </div>
    `;
    app.appendChild(hero);
  }

  // ── Strip
  const strip = h('section', 'strip fade-in d1');
  // This strip is now exactly one thing: where the bot P/L came from, plus the
  // dry powder behind it. Four of the seven tiles were removed because each one
  // restated a number the reader had already passed on the way down:
  //
  //   Total Assets  ₩135,699,389  = the KIS tile + the Upbit tile, immediately
  //                                 above it, added together
  //   Upbit (BTC)   ₩10,759,835   = the Upbit account tile, verbatim
  //   Total P&L     ₩+1,258,926   = the hero's own "Bot P/L YTD" line, same
  //                                 figure and same percentage
  //   Active Bots   9             = the "9 strategies" counter in the header,
  //                                 with the cron name that is already printed
  //                                 in the footer
  //
  // What is left — Realized and Unrealized — are the two halves the hero's
  // total is made of and appear nowhere else, and KIS Cash is the only view of
  // uninvested broker cash on the page.
  const stripData = totalAsset > 0 ? [
    { lbl: 'KIS Cash', val: '₩' + Math.round(cashKRW).toLocaleString(), sub: '$' + cashUSD.toLocaleString(undefined, {maximumFractionDigits: 0}) + ' USD' },
    { lbl: 'Realized YTD', val: fmtPnl(realCombined, 'KRW'), cls: pnlClass(realCombined), sub: 'KRW ' + fmtPnl(realKRW, 'KRW') + ' + USD ' + fmtPnl(realUSD, 'USD') },
    { lbl: 'Unrealized', val: fmtPnl(unrealCombined, 'KRW'), cls: pnlClass(unrealCombined), sub: 'KRW ' + fmtPnl(unrealKRW, 'KRW') + ' + USD ' + fmtPnl(unrealUSD, 'USD') },
  ] : [
    { lbl: 'KIS Cash', val: '—', sub: 'Waiting for data update' },
    { lbl: 'Realized YTD', val: '—', sub: 'Waiting for data update' },
    { lbl: 'Unrealized', val: '—', sub: 'Waiting for data update' },
  ];
  stripData.forEach(d => {
    const cell = h('div', 'cell');
    cell.innerHTML = `<div class="lbl">${d.lbl}</div><div class="val ${d.cls || ''}">${d.val}</div><div class="sub">${d.sub}</div>`;
    strip.appendChild(cell);
  });
  app.appendChild(strip);

  // Allocation goes ABOVE the bots: this is the layer that decided their
  // budgets, and reading it after the results inverts the causality.
  const allocSec = buildAllocation(data.allocation, data.accounts);
  if (allocSec) app.appendChild(allocSec);

  // ── Strategy Comparison Chart (per-bot Total P/L + Portfolio Sum overlay)
  const cmp = buildComparisonChart(data.equity_series || {}, data.equity_series_aggregate || {}, data.strategies || []);
  if (cmp) app.appendChild(cmp);


  // ── Mobile Tabs
  const mobTabs = h('div', 'mob-tabs');
  mobTabs.innerHTML = `<button class="mob-tab active" data-tab="strats">Strategies</button><button class="mob-tab" data-tab="feed">Feed</button>`;
  app.appendChild(mobTabs);

  // Tab logic
  mobTabs.querySelectorAll('.mob-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      mobTabs.querySelectorAll('.mob-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.mob-section').forEach(s => s.classList.remove('active'));
      document.querySelector(`.mob-section[data-section="${btn.dataset.tab}"]`)?.classList.add('active');
    });
  });

  // ── Grid
  const grid = h('div', 'grid');

  // ── Strategies
  const stratsWrap = h('div', 'mob-section active', '');
  stratsWrap.dataset.section = 'strats';
  const strats = h('section', 'strats fade-in d2');

  data.strategies.forEach(s => {
    const isManual = s.id === 'manual';
    const card = h('div', isManual ? 'strat manual' : 'strat');
    // Identity rail. Same colour as this bot's chart line, allocation dot
    // and feed entries — that repetition is what makes it an identity.
    card.style.boxShadow = 'inset 3px 0 0 ' + botColor(s.id);
    // The hands-on sleeve has no run schedule, so staleness/paper-mode don't apply.
    //
    // is_stale comes from the generator, which knows each bot's CADENCE. The
    // old test here was `stale_hours > 6`, and every stock bot fires once per
    // session — so the US bots read 21h by dinner every day and seven of the
    // eight cards showed STALE at once while all of them were live. A badge
    // that is always lit is furniture; it cannot report the bot that did die.
    // Explicit === true: is_stale is null when the age is unknown, and
    // "unknown" must not render as a confident "Stale".
    const isStale = !isManual && s.is_stale === true;
    // Paper outranks stale. Paper is a DEPLOYMENT fact (no capital at risk),
    // stale is a HEALTH fact, and letting the health badge overwrite the
    // deployment one made an unfunded paper bot indistinguishable from a
    // dead live bot — korea_etf reads paper/budget 0 and had run that morning.
    const isPaper = !isManual && s.mode === 'paper';
    // "testing" is its own deployment fact, between paper and live: real money
    // and real fills, but a configuration that did NOT pass the promotion gates
    // (USVB runs sleeve-only, USVB_CORE_WEIGHT=0). Folding it into "live" is
    // what let the USVB card wear a green LIVE badge above a footer that called
    // itself PAPER — two contradictory claims about the same bot, on one card.
    const isTesting = !isManual && s.mode === 'testing';
    const modeTag = isManual ? 'manual'
      : (isPaper ? 'paper' : (isTesting ? 'testing' : (isStale ? 'stale' : 'live')));
    const modeLabel = isManual ? 'Manual'
      : (isPaper ? 'Paper' : (isTesting ? 'Testing' : (isStale ? 'Stale' : 'Live')));

    let metricsHTML = '';
    let holdingsHTML = '';
    let signalHTML = '';

    if (s.id === 'btc_vb') {
      // "Unlimited" was true but useless: this bot has no imposed cap because it
      // runs on the whole Upbit balance, and that balance is the budget. The
      // generator now fills it, so show the amount and say where it comes from.
      const btcBudgetLabel = s.budget > 0
        ? fmtVal(s.budget, 'KRW') + (s.budget_basis === 'account' ? mSub('(full account)') : '')
        : 'Unlimited';
      // cost_basis is filled by the generator for account-owning bots (value
      // minus unrealized), so Invested is a real number here rather than the
      // dash it used to be.
      metricsHTML = coreMetrics({cur: 'KRW', invested: s.cost_basis, budget: s.budget,
        budgetLabel: btcBudgetLabel, value: s.value,
        unrealized: s.unrealized_profit, realized: s.realized_profit_ytd, trades: s.realized_trades,
        totalPl: s.total_pl_ytd, profitPct: s.profit_rate_ytd_pct, basis: s.profit_rate_basis,
        winRate: s.win_rate_pct, cycles: s.cycles_ytd});
      // The "Allocation: Full / Reduced" cell is gone. It was a word for the
      // ratio the Budget Cap cell states three columns earlier in currency,
      // and that cell already carries "(full account)" when the budget IS the
      // whole Upbit balance — which is the only condition under which this one
      // ever said "Full".
      const sigClass = s.is_holding ? 'long' : 'cash';
      const sigLabel = s.is_holding ? 'Holding BTC' : 'Cash — No Signal';
      signalHTML = `<div class="sig ${sigClass}">${sigLabel}</div>`;
    }

    else if (s.id === 'korea_etf') {
      const ketfBudget = s.budget || 0;
      const ketfInvested = s.cost_basis || 0;
      const ketfPct = ketfBudget > 0 ? Math.round(ketfInvested / ketfBudget * 100) : 0;
      metricsHTML = coreMetrics({cur: 'KRW', invested: ketfInvested, budget: ketfBudget, value: s.value,
        unrealized: s.unrealized_profit, realized: s.realized_profit_ytd, trades: s.realized_trades,
        totalPl: s.total_pl_ytd, profitPct: s.profit_rate_ytd_pct, basis: s.profit_rate_basis,
        winRate: s.win_rate_pct, cycles: s.cycles_ytd})
        + mCell('Target', s.extra?.target_ticker || MDASH);
      if (s.extra?.target) {
        signalHTML = `<div class="sig long">${s.extra.target}</div>`;
      }
    }

    else if (s.id === 'quant40' || s.id === 'jd_strategy') {
      const posBudget = s.budget || 0;
      const posInvested = s.cost_basis || 0;
      const posPct = posBudget > 0 ? Math.round(posInvested / posBudget * 100) : 0;
      metricsHTML = coreMetrics({cur: 'USD', invested: posInvested, budget: posBudget, value: s.value,
        unrealized: s.unrealized_profit, realized: s.realized_profit_ytd, trades: s.realized_trades,
        totalPl: s.total_pl_ytd, profitPct: s.profit_rate_ytd_pct, basis: s.profit_rate_basis,
        winRate: s.win_rate_pct, cycles: s.cycles_ytd});
      if (s.id === 'jd_strategy') {
        // JD Strategy: two badges — market state + holding state
        const stateMap = { 'NORMAL': 'cash', 'ALERT': 'bear', 'PANIC': 'bear' };
        const stateCls = stateMap[s.extra?.state] || 'cash';
        const stateLabel = s.extra?.signal || s.extra?.state || 'UNKNOWN';
        const holdCls = s.extra?.is_holding ? 'long' : 'cash';
        const holdLabel = s.extra?.is_holding ? 'LONG' : 'CASH';
        // Show holding tickers if any
        const holdTickers = (s.holdings || []).map(h => h.ticker).join(', ');
        const holdFull = s.extra?.is_holding && holdTickers ? `LONG ${holdTickers}` : holdLabel;
        signalHTML = `<div class="sig ${stateCls}" style="font-size:0.5rem">${stateLabel.substring(0, 60)}</div> <div class="sig ${holdCls}" style="font-size:0.5rem">${holdFull}</div>`;
      } else if (s.extra?.signal) {
        const sigCls = s.extra.regime === 'bullish' ? 'long' : (s.extra.regime === 'bearish' ? 'bear' : 'cash');
        signalHTML = `<div class="sig ${sigCls}" style="font-size:0.5rem">${s.extra.signal.substring(0, 60)}</div>`;
      }
    }

    else if (s.id === 'dual_momentum') {
      const dmBudget = s.budget || 0;
      const dmInvested = s.cost_basis || 0;
      const dmPct = dmBudget > 0 ? Math.round(dmInvested / dmBudget * 100) : 0;
      metricsHTML = coreMetrics({cur: 'USD', invested: dmInvested, budget: dmBudget, value: s.value,
        unrealized: s.unrealized_profit, realized: s.realized_profit_ytd, trades: s.realized_trades,
        totalPl: s.total_pl_ytd, profitPct: s.profit_rate_ytd_pct, basis: s.profit_rate_basis,
        winRate: s.win_rate_pct, cycles: s.cycles_ytd});
    }

    else if (s.id === 'hybrid_vb') {
      const kr = s.kr || {};
      const us = s.us || {};
      const krInvested = kr.cost_basis || 0;
      const usInvested = us.cost_basis || 0;
      const krUnreal = kr.unrealized_profit ?? kr.profit ?? 0;
      const usUnreal = us.unrealized_profit ?? us.profit ?? 0;
      const krRealized = kr.realized_profit_ytd || 0;
      const usRealized = us.realized_profit_ytd || 0;
      const krTrades = kr.realized_trades || 0;
      const usTrades = us.realized_trades || 0;
      const krBudget = s.budget_kr || 0;
      const usBudget = s.budget_us || 0;
      const krPct = krBudget > 0 ? Math.round(krInvested / krBudget * 100) : 0;
      const usPct = usBudget > 0 ? Math.round(usInvested / usBudget * 100) : 0;
      const krPos = Object.keys(s.open_positions?.kr || {}).length;
      const usPos = Object.keys(s.open_positions?.us || {}).length;
      // Two legs, each through the SAME core in the SAME order — only the
      // prefix and the currency differ. Reading the US half is then exactly the
      // habit you already built on the KR half.
      metricsHTML =
        mSep('KR leg')
        + coreMetrics({cur: 'KRW', prefix: 'KR', invested: krInvested, budget: krBudget,
          value: kr.value, unrealized: krUnreal, realized: krRealized, trades: krTrades,
          totalPl: kr.total_pl_ytd, profitPct: kr.profit_rate_ytd_pct,
          winRate: kr.win_rate_pct, cycles: kr.cycles_ytd})
        // Force a fresh row: without it the US leg begins wherever the KR leg
        // ran out and the halves run together mid-row.
        + mSep('US leg')
        + coreMetrics({cur: 'USD', prefix: 'US', invested: usInvested, budget: usBudget,
          value: us.value, unrealized: usUnreal, realized: usRealized, trades: usTrades,
          totalPl: us.total_pl_ytd, profitPct: us.profit_rate_ytd_pct,
          winRate: us.win_rate_pct, cycles: us.cycles_ytd})
        + mCell('Positions', krPos + ' KR · ' + usPos + ' US');
    }

    else if (s.id === 'claude_bot') {
      const ex = s.extra || {};
      const regime = ex.regime || 'NEUTRAL';
      const regimeColors = { 'BULLISH': 'up', 'RECOVERY': '', 'NEUTRAL': 'amber', 'CAUTIOUS': 'amber', 'BEARISH': 'dn', 'DANGER': 'dn' };
      const regimeCls = regimeColors[regime] || '';
      const breadth = ex.breadth_score || 0;
      const uptrend = ex.uptrend_score || 0;
      const trendPasses = ex.trend_pass_count || 0;
      const vcpCount = ex.vcp_count || 0;
      const cbBudget = s.budget || 0;
      const cbInvested = s.cost_basis || 0;
      const cbPct = cbBudget > 0 ? Math.round(cbInvested / cbBudget * 100) : 0;
      metricsHTML =
        coreMetrics({cur: 'USD', invested: cbInvested, budget: cbBudget, value: s.value,
          unrealized: s.unrealized_profit, realized: s.realized_profit_ytd,
          trades: s.realized_trades, totalPl: s.total_pl_ytd,
          profitPct: s.profit_rate_ytd_pct, basis: s.profit_rate_basis, winRate: s.win_rate_pct, cycles: s.cycles_ytd})
        // Bot-specific: this is the only bot that publishes a market regime read.
        + mCell('Regime', regime, regimeCls + ' bold')
        + mCell('Confidence', (ex.confidence || 0) + '%')
        + mCell('Breadth', breadth + '/100', breadth >= 60 ? 'up' : breadth >= 40 ? 'amber' : 'dn')
        + mCell('Uptrend', uptrend + '/100', uptrend >= 60 ? 'up' : uptrend >= 40 ? 'amber' : 'dn')
        + mCell('Trend Passes', trendPasses + '/100')
        + mCell('VCP Candidates', String(vcpCount));
      // Show exposure recommendation as signal badge
      const expMap = { 'FULL_EXPOSURE': 'long', 'NORMAL': 'cash', 'SELECTIVE_LONGS': 'cash', 'REDUCE_EXPOSURE': 'bear', 'CASH_PRIORITY': 'bear' };
      const expCls = expMap[ex.exposure] || 'cash';
      signalHTML = `<div class="sig ${expCls}" style="font-size:0.5rem">${(ex.exposure || 'NORMAL').replace(/_/g, ' ')}</div>`;

      // Show VCP candidates + trend passes as holdings
      const cands = ex.screener_candidates || [];
      const passes = ex.trend_passes || [];
      if (cands.length > 0) {
        const rows = cands.slice(0, 5).map(c => {
          const sym = c.symbol || c.ticker || '?';
          const price = c.current_price || c.pivot_price || 0;
          const score = c.score || c.total_score || 0;
          return `<div class="hold-row">
            <span class="hold-tk">${sym}</span>
            <span class="hold-det">VCP pivot $${(c.pivot_price||0).toFixed(2)} / stop $${(c.stop_loss||0).toFixed(2)}</span>
            <span class="hold-pl amber">score ${score}</span>
          </div>`;
        }).join('');
        holdingsHTML = `<div class="holds"><div style="font-size:0.58rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--tx4);margin-bottom:0.3rem">VCP Candidates</div>${rows}</div>`;
      } else if (passes.length > 0) {
        const rows = passes.slice(0, 6).map(t => {
          return `<div class="hold-row">
            <span class="hold-tk">${t.symbol}</span>
            <span class="hold-det">trend ${t.score}/8</span>
            <span class="hold-pl ${t.pct_from_high > -5 ? 'up' : 'amber'}">${t.pct_from_high}%</span>
          </div>`;
        }).join('');
        holdingsHTML = `<div class="holds"><div style="font-size:0.58rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--tx4);margin-bottom:0.3rem">Trend Template Passes (${passes.length})</div>${rows}</div>`;
      }
    }

    else if (s.id === 'nmf2') {
      const ex = s.extra || {};
      const nBudget = s.budget || 0;
      const nInvested = s.cost_basis || 0;
      const nPct = nBudget > 0 ? Math.round(nInvested / nBudget * 100) : 0;
      // No win-rate row: this sleeve keeps a position ledger, not a closed-trade
      // book, so the cell would read 0 and imply "never won".
      metricsHTML =
        coreMetrics({cur: 'KRW', invested: nInvested, budget: nBudget, value: s.value,
          unrealized: s.unrealized_profit, realized: s.realized_profit_ytd,
          trades: s.realized_trades, totalPl: s.total_pl_ytd,
          profitPct: s.profit_rate_ytd_pct, basis: s.profit_rate_basis,
          // Omitted, not missing: this sleeve keeps a POSITION ledger, not a
          // closed-trade book, so a win rate would be 0/0 and read as "never won".
          omit: ['winRate']})
        + mCell('Positions', (ex.ticker_count || 0) +
            '<span style="color:var(--tx4)">/' + (ex.ledger_position_count || 0) + '</span>')
        + mCell('Ledger Cash', fmtVal(ex.cash_krw || 0, 'KRW'));
      signalHTML = `<div class="sig long" style="font-size:0.5rem">TOSS · 신마법공식 2.0 + 계절성</div>`;
    }

    else if (s.id === 'usvb') {
      const ex = s.extra || {};
      // Currency comes from the DATA, never from a literal here. This bot has
      // two generator paths that disagree: build_usvb_live_card() reads the
      // ledger and publishes KRW, build_usvb_card() is the paper status.json
      // fallback and publishes USD. The card hard-coded 'USD', so on the live
      // path it printed the ₩2,786,000 budget as "$2,786,000.00" — a
      // thousand-fold overstatement of a $2,000 sleeve, sitting directly above
      // a single share of TQQQ worth $71. Hard-coding 'KRW' instead would just
      // move the same bug onto the other path.
      metricsHTML =
        coreMetrics({cur: s.currency || 'KRW', invested: s.cost_basis, budget: s.budget,
          value: s.value, unrealized: s.total_pl_ytd,
          totalPl: s.total_pl_ytd, profitPct: s.profit_rate_ytd_pct,
          basis: s.profit_rate_basis,
          omit: ['realized', 'winRate']})
        // Dropped from this card: Core (QQQ), Pending orders and Paper since.
        // All three read keys the generator does not emit (`core_usd`,
        // `pending`, `paper_since`), so they were frozen at $0.00 / 0 / "—".
        // Core is zero by DESIGN besides — this deployment runs
        // USVB_CORE_WEIGHT=0 — and "Paper since" contradicts a bot that has
        // been trading real money since 2026-08-21.
        //
        // Sleeve cash stays — it is the one number that says whether the bot
        // can still take a trade tonight — but it now reads whichever key the
        // active path actually fills. It was reading `sleeve_cash_usd` only,
        // which the ledger path never writes, so it showed $0.00 while the
        // sleeve held $1,927.89.
        + mCell('Sleeve cash',
            fmtVal(ex.cash_usd ?? ex.sleeve_cash_usd ?? 0, 'USD'))
        + (ex.budget_usd ? mCell('Budget', fmtVal(ex.budget_usd, 'USD')) : '');
      signalHTML = '<div class="sig cash" style="font-size:0.5rem">TESTING · sleeve-only, not the gate-passing blend · real money</div>';
    }

    else if (isManual) {
      const ex = s.extra || {};
      // Same core, same order as every bot — but four fields are omitted rather
      // than dashed, because this sleeve structurally cannot have them: nobody
      // allocates it a budget (it is senior capital, not a bot), and it keeps no
      // closed-trade book, so realized P/L and win rate have no meaning here.
      //
      // Unrealized is omitted for BOTH reasons at once. The generator publishes
      // no unrealized_profit for this sleeve, so the cell was a standing em
      // dash — and it could only ever have repeated Total P/L, because with no
      // realized book every won of this sleeve's P/L is unrealized by
      // definition.
      metricsHTML =
        coreMetrics({cur: 'KRW', invested: s.cost_basis, value: s.value,
          unrealized: s.unrealized_profit, totalPl: s.total_pl_ytd,
          profitPct: s.profit_rate_ytd_pct, basis: s.profit_rate_basis,
          omit: ['budget', 'unrealized', 'realized', 'winRate']})
        + mCell('Positions', String(ex.ticker_count || 0));
        // Four cells removed here, all of them restating something already on
        // the card:
        //   Toss           = Market Value, and its (5) = Positions
        //   Toss P/L       = Total P/L
        //   KIS (no bot)   = ₩0 (0), permanently
        //   KIS Unrealized = ₩+0, permanently
        // The sleeve is DEFINED as Toss stock minus NMF2's claimed shares, so
        // the two Toss cells could only ever echo the core run, and the two
        // KIS cells could only ever be zero. Unclaimed KIS stock is still
        // recorded in the data as extra.kis_unclaimed_krw, where it belongs:
        // it is a bot-ledger alarm, not a line item of his own money. If it
        // ever goes non-zero it deserves a warning, not a zero-valued cell
        // that nobody reads because it has never once moved.
      signalHTML = `<div class="sig cash" style="font-size:0.5rem">HANDS-ON · NOT BOT-MANAGED</div>`;
    }

    // Holdings
    const holdings = (s.id === 'hybrid_vb') ? s.holdings : (s.holdings || []);
    if (holdings.length > 0) {
      // NMF2 는 30종목을 전부 보여주고 스크롤한다. 5개만 보이면 바스켓을 확인할 수 없다.
      const showAll = (s.id === 'nmf2');
      const rows = (showAll ? holdings : holdings.slice(0, 5)).map(hld => {
        const cur = hld.currency || s.currency || 'USD';
        const pnl = hld.profit || 0;
        const pRate = (typeof hld.profit_rate === 'number') ? ` (${hld.profit_rate >= 0 ? '+' : ''}${hld.profit_rate.toFixed(1)}%)` : '';
        // 코드가 아니라 회사명. 069500 을 보고 무슨 종목인지 아는 사람은 없다.
        // 코드는 버리지 않고 상세줄로 옮긴다 — 주문을 넣을 때는 코드가 필요하다.
        // NMF2·수동 슬리브가 쓰던 방식 그대로다.
        const label = hld.name || hld.ticker;
        const code = (hld.name && hld.name !== hld.ticker) ? `${hld.ticker} · ` : '';
        return `<div class="hold-row">
          <span class="${hld.name ? 'hold-nm' : 'hold-tk'}">${label}</span>
          <span class="hold-det">${code}${hld.quantity || 0} × ${sym(cur)}${(hld.current_price || hld.avg_price || 0).toLocaleString(undefined, cur === 'KRW' ? {maximumFractionDigits:0} : {minimumFractionDigits:2, maximumFractionDigits:2})}</span>
          <span class="hold-pl ${pnlClass(pnl)}">${fmtPnl(pnl, cur)}${pRate}</span>
        </div>`;
      }).join('');
      holdingsHTML = `<div class="holds${showAll && holdings.length > 6 ? ' scroll' : ''}">${rows}</div>`;
    }

    // Open positions for Hybrid VB
    if (s.id === 'hybrid_vb') {
      const ops = s.open_positions || {};
      let posRows = '';
      for (const [market, positions] of Object.entries(ops)) {
        for (const [ticker, pos] of Object.entries(positions)) {
          const cur = market === 'kr' ? 'KRW' : 'USD';
          const pName = pos.name || ticker;
          const pCode = (pos.name && pos.name !== ticker) ? `${ticker} · ` : '';
          posRows += `<div class="hold-row">
            <span class="${pos.name ? 'hold-nm' : 'hold-tk'}">${pName}</span>
            <span class="hold-det">${pCode}${pos.shares}sh @ ${sym(cur)}${Math.round(pos.entry_price).toLocaleString()} · stop ${sym(cur)}${Math.round(pos.stop_price).toLocaleString()}</span>
            <span class="hold-pl" style="color:var(--tx3)">${market.toUpperCase()}</span>
          </div>`;
        }
      }
      if (posRows) {
        holdingsHTML = `<div class="holds">${posRows}</div>`;
      }
    }

    // Hands-on rows show VALUE, not P/L: the Toss half of this sleeve has no
    // cost basis, and the generic renderer's `hld.profit || 0` would print a
    // confident "₩0" gain for every Toss position.
    if (isManual) {
      // 잘라내지 않고 전부 보여준다(스크롤). 종목명이 앞, 코드는 상세줄로 뺀다.
      const mHoldings = s.holdings || [];
      const rows = mHoldings.map(hld => {
        const label = hld.name || hld.ticker;
        const code = (hld.name && hld.name !== hld.ticker) ? `${hld.ticker} · ` : '';
        const qty = (hld.qty || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
        return `<div class="hold-row">
          <span class="${hld.name ? 'hold-nm' : 'hold-tk'}">${label}</span>
          <span class="hold-det">${code}${qty} × ${sym(hld.currency || 'KRW')}${(hld.current_price || 0).toLocaleString(undefined, hld.currency === 'USD' ? {minimumFractionDigits:2, maximumFractionDigits:2} : {maximumFractionDigits:0})}</span>
          <span class="hold-pl ${typeof hld.profit_rate === 'number' ? pnlClass(hld.pl_krw || 0) : ''}" ${typeof hld.profit_rate === 'number' ? '' : 'style="color:var(--tx2)"'}>${typeof hld.profit_rate === 'number' ? fmtPnl(hld.pl_krw || 0, 'KRW') + ' (' + (hld.profit_rate >= 0 ? '+' : '') + hld.profit_rate.toFixed(1) + '%)' : '₩' + Math.round(hld.value_krw || 0).toLocaleString()}</span>
        </div>`;
      }).join('');
      holdingsHTML = rows ? `<div class="holds${mHoldings.length > 6 ? ' scroll' : ''}">${rows}</div>` : '';
    }

    // Sparkline chart from equity_series
    let chartHTML = '';
    const eqSeries = data.equity_series || {};
    const chartId = s.id;
    if (eqSeries[chartId] && eqSeries[chartId].length >= 2) {
      chartHTML = renderSparkline(eqSeries[chartId]);
    }

    card.innerHTML = `
      <div class="strat-top">
        <span class="strat-name"><span class="bot-dot" style="background:${botColor(s.id)}"></span>${s.name}</span>
        <span class="tag ${modeTag}">${modeLabel}</span>
      </div>
      <div class="strat-grid">${metricsHTML}</div>
      ${chartHTML}
      ${holdingsHTML}
      ${signalHTML}
    `;
    strats.appendChild(card);
  });

  stratsWrap.appendChild(strats);
  grid.appendChild(stratsWrap);

  // ── Feed
  const feedWrap = h('div', 'mob-section', '');
  feedWrap.dataset.section = 'feed';
  const feed = h('aside', 'feed fade-in d3');
  feed.innerHTML = `<div class="feed-hdr">Activity Feed</div>`;

  const msgs = h('div', 'msgs');

  if (data.feed && data.feed.length > 0) {
    data.feed.forEach(ev => {
      const typeMap = {
        'trade_buy': 't-buy', 'trade_sell': 't-sell',
        'signal': 't-signal', 'session': 't-session',
        'portfolio': 't-portfolio', 'error': 't-error'
      };
      const tagMap = {
        'trade_buy': 'Buy', 'trade_sell': 'Sell',
        'signal': 'Signal', 'session': 'Session',
        'portfolio': 'Portfolio', 'error': 'Error'
      };

      const cls = typeMap[ev.type] || 't-session';
      const tag = tagMap[ev.type] || ev.type;

      const m = h('div', `msg ${cls}`);
      // The rail used to encode the EVENT TYPE, duplicating what the tag already
      // says while telling you nothing about which bot was talking. Rail = bot
      // identity, tag = buy/sell. One glance now answers both.
      if (ev.bot) m.style.borderLeftColor = botColor(ev.bot);
      m.innerHTML = `
        <div class="msg-top">
          <span class="msg-tag">${tag}</span>
          <span class="msg-ts">${shortTime(ev.timestamp)}</span>
        </div>
        <div class="msg-title">${ev.title}</div>
        <div class="msg-body">${ev.body || ''}</div>
        <div class="msg-src">${ev.bot ? `<span class="bot-dot" style="background:${botColor(ev.bot)};width:5px;height:5px;margin-right:0.35rem"></span>` : ''}${ev.source || ''} · ${relTime(ev.timestamp)}</div>
      `;
      msgs.appendChild(m);
    });
  } else {
    msgs.innerHTML = '<div class="msg"><div class="msg-body">No recent events. Logs may not be accessible from this host.</div></div>';
  }

  feed.appendChild(msgs);
  feedWrap.appendChild(feed);
  grid.appendChild(feedWrap);

  app.appendChild(grid);

  // ── Footer
  const ftr = h('footer', 'ftr fade-in d4');
  ftr.innerHTML = `
    <span>automation oracle · oracle cloud · 193.123.246.52</span>
    <span>auto-refresh 60s · cron: check_and_run.sh</span>
  `;
  app.appendChild(ftr);
}

// ═══ Data Fetching ════════════════════════════════════════
let refreshTimer = null;

async function load() {
  try {
    const [res, histRes] = await Promise.all([
      // no-store 필수. 기본 캐시로 두면 발행이 끝난 뒤에도 브라우저가 직전
      // 빌드의 JSON 을 그대로 재생한다 — 2026-08-20 19:27 발행 직후에도
      // 열려 있던 탭은 16:00 값(수동 1.85억, 이미 판 빙그레 포함)을 계속
      // 보여줬다. 60초 자동 새로고침도 같은 캐시를 다시 읽으니 소용없다.
      // decision.html 은 처음부터 no-store 였다 — 여기만 빠져 있었다.
      fetch('data/dashboard_data.json', { cache: 'no-store' }),
      fetch('data/equity_history.json', { cache: 'no-store' }).catch(()=>null)
    ]);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (histRes && histRes.ok) {
      const eqData = await histRes.json();
      if (!data.equity_series) data.equity_series = eqData;
    }
    render(data);
  } catch (e) {
    const app = document.querySelector('#app');
    const loader = document.querySelector('#loader');
    if (loader) {
      app.innerHTML = '<header class="hdr fade-in"><h1>Automation <em>Oracle</em></h1>' +
        '<div class="hdr-right"><a class="refresh-btn" href="decision.html" style="text-decoration:none">→ Decision Center</a></div></header>' +
        '<div style="padding:3rem 0;text-align:center;color:var(--tx3);font-size:0.8rem">' +
        'Dashboard data not available. Updated daily after market close.</div>';
    }
  }
}

startBackdrop();
load();
</script>
