<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oracle</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#08080a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════
   ORACLE DASHBOARD
   Aesthetic: Dark brutalist-minimal. Monochrome canvas,
   single amber accent. Newsreader serif for hierarchy,
   DM Mono for data. Dense but breathable.
   ══════════════════════════════════════════════════════ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #08080a;
  /* Surfaces are translucent so the chrome backdrop drifts THROUGH the page
     rather than only around it. 0.82 over a backdrop whose own peak luminance
     is held near #1a1c22 keeps every panel within a couple of points of the
     old flat #0e0e11 — the sheen has to be visible on six-figure numbers
     without ever competing with them. */
  --s1: rgba(14, 14, 17, 0.82);
  --s2: rgba(22, 22, 27, 0.88);
  --s3: rgba(26, 26, 31, 0.9);
  --s4: rgba(34, 34, 40, 0.9);
  --border: rgba(52, 52, 62, 0.55);
  --border-h: #2a2a32;
  --tx: #e2ded8;
  --tx2: #8a857e;
  --tx3: #55524d;
  --tx4: #333130;
  --accent: #c9a24d;
  --accent-d: #c9a24d18;
  --g: #3a8a5a;
  --g-bg: #3a8a5a10;
  --r: #a84848;
  --r-bg: #a8484810;
  --blue: #4a78a8;
  --purple: #7a68a8;
  --mono: 'DM Mono', 'SF Mono', 'Menlo', monospace;
  --serif: 'Newsreader', 'Georgia', serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

html { font-size: 13px; }

body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--mono);
  font-weight: 300;
  line-height: 1.55;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: var(--safe-b);
}

/* Grain */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

/* ── Chrome backdrop ──
   A drifting metallic sheen. It is painted into a deliberately TINY buffer
   (see startBackdrop()) and stretched across the viewport, so the softness is
   the browser's own bilinear upscale rather than a per-pixel blur — the whole
   effect costs a few hundred pixels of fill per frame.

   It sits BEHIND translucent panels rather than in the gutters, because at the
   1440px shell cap a wide screen has no gutters and the effect would be
   invisible on exactly the monitor it was asked for. */
#bgfx {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  display: block;
}

/* Brushed-metal micro-streaks. Deliberately STATIC: the drift already comes
   from the canvas, and animating the grain too reads as a failing panel
   rather than as metal. */
#bgfx-brush {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    102deg,
    transparent 0 2px,
    rgba(214, 222, 236, 0.028) 2px 3px,
    transparent 3px 7px);
}

/* Everything the page draws rides above the backdrop. */
.shell { position: relative; z-index: 1; }

a { color: var(--accent); text-decoration: none; }

.shell {
  max-width: 1440px;
  margin: 0 auto;
  padding: 1.8rem 2.5rem;
}

/* ── Loading State ── */
.loading-state {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  flex-direction: column;
  gap: 1rem;
}

.loading-state .spinner {
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-state span { color: var(--tx3); font-size: 0.8rem; }

/* ── Header ── */
.hdr {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
}

.hdr h1 {
  font-family: var(--serif);
  font-weight: 300;
  font-size: 1.6rem;
  letter-spacing: -0.03em;
}

.hdr h1 em { font-style: italic; color: var(--accent); }

.hdr-right {
  display: flex;
  gap: 1.5rem;
  align-items: center;
}

.live-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--g);
  display: inline-block;
  margin-right: 0.4rem;
  animation: blink 2.5s ease infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.hdr-meta { font-size: 0.75rem; color: var(--tx3); }

.refresh-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--tx3);
  font-family: var(--mono);
  font-size: 0.7rem;
  padding: 0.3rem 0.7rem;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.05em;
}

.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Metric Strip ── */
 /* Hairlines are drawn by each CELL's box-shadow bleeding into the 1px gap,
    not by letting a --border container show through it. With the old
    technique any grid area without a cell in it — a 7th tile wrapping under a
    row of six — painted as a solid grey block that read as a panel that had
    failed to load. Shadows only exist where a cell exists, so a short last
    row is now just surface. The same fix is applied to .hero-accts. */
.strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--s1);
  border: 1px solid var(--border);
  margin-bottom: 2rem;
}

.strip .cell {
  background: var(--s1);
  box-shadow: 0 0 0 1px var(--border);
  padding: 1rem 1.2rem;
}

.strip .cell:hover { background: var(--s2); }

.cell .lbl {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--tx4);
  margin-bottom: 0.35rem;
}

.cell .val {
  font-size: 1.35rem;
  font-weight: 500;
  letter-spacing: -0.03em;
  white-space: nowrap;
}

.cell .sub {
  font-size: 0.72rem;
  color: var(--tx3);
  margin-top: 0.15rem;
}

.up { color: var(--g); }
.dn { color: var(--r); }
.amber { color: var(--accent); }

/* ── Total-Capital Hero ──
   Named "Total Capital", not "Total Investments": ~44% of this figure is cash,
   so "investments" was simply wrong, and the allocation panel below derives
   everything from the same number under the name Total capital. One number
   with two names on one page is a number the reader has to reconcile.
   The JSON key stays `totals.investments_krw` — four test files, two fixtures
   and notify_discord.py read it, and none of that is worth churning for a label.

   Row A total (KIS+Upbit+Toss) / Row B per-account tiles / Row C bots-manual-cash
   split. Everything it reads is additive JSON (data.totals, data.accounts): when
   an older generator publishes without them the whole block is skipped and the
   metric strip below is unchanged. */
.hero {
  border: 1px solid var(--border);
  background: var(--s1);
  margin-bottom: 2rem;
}

.hero-top { padding: 1.4rem 1.4rem 1.2rem; }

.hero-lbl {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--tx4);
  margin-bottom: 0.55rem;
}

.hero-val {
  font-family: var(--serif);
  font-size: 2.6rem;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.03em;
}

.hero-sub { font-size: 0.72rem; color: var(--tx3); margin-top: 0.55rem; }
.hero-pnl { font-size: 0.78rem; margin-top: 0.3rem; }

/* Four accounts, four columns. It was three, so Toss wrapped alone onto a
   second row beside a grey ghost cell two thirds of the panel wide. */
.hero-accts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--s1);
  border-top: 1px solid var(--border);
}

.hero-acct {
  background: var(--s1);
  box-shadow: 0 0 0 1px var(--border);
  padding: 0.9rem 1.2rem;
}
.hero-acct.stale .a-val { color: var(--tx3); }

.hero-acct .a-name {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--tx4);
}

.hero-acct .a-val {
  font-size: 1.1rem;
  margin-top: 0.35rem;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.hero-acct .a-meta { font-size: 0.62rem; color: var(--tx3); margin-top: 0.2rem; }

.badge-stale {
  font-size: 0.5rem;
  letter-spacing: 0.1em;
  padding: 0 0.3rem;
  border: 1px solid var(--r);
  color: var(--r);
}

.hero-split { padding: 1.1rem 1.4rem 1.3rem; border-top: 1px solid var(--border); }

.split-bar { display: flex; height: 10px; background: var(--s3); overflow: hidden; }
.split-seg { height: 100%; }

.split-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 1.3rem;
  margin-top: 0.7rem;
  font-size: 0.68rem;
  color: var(--tx2);
}

.split-legend .sl { display: flex; align-items: baseline; gap: 0.4rem; }
.split-legend b { color: var(--tx); font-weight: 500; }
.split-sw { width: 8px; height: 8px; align-self: center; }

.recon-warn { color: var(--r); font-size: 0.66rem; margin-top: 0.6rem; }

/* ── Asset allocation — the layer ABOVE the bots ──
   The bots never choose their own size; this layer does, and the bots only read
   the budget it writes. That inversion is the governance model, and it used to
   be invisible on this page: you could see what each bot DID with its money and
   never see who decided the amount. Placed above the bot grid on purpose —
   capital is allocated before it is traded. */
.alloc { background: var(--s1); border: 1px solid var(--border); margin-bottom: 2rem; }

.alloc-hd {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 1rem; flex-wrap: wrap;
  padding: 1rem 1.4rem; border-bottom: 1px solid var(--border);
}
.alloc-hd h2 {
  font-family: var(--serif); font-weight: 300;
  font-size: 1.05rem; letter-spacing: -0.02em;
}
.alloc-hd .meta { font-size: 0.64rem; color: var(--tx3); }
.alloc-badge {
  font-size: 0.56rem; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 0.15rem 0.45rem; border: 1px solid var(--border-h); color: var(--tx2);
}
.alloc-badge.ok   { border-color: var(--g); color: var(--g); }
.alloc-badge.warn { border-color: var(--accent); color: var(--accent); }

.alloc-levels {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 1px; background: var(--border);
}
.alloc-lv { background: var(--s1); padding: 1.05rem 1.4rem; }
.alloc-lv .lv-tag {
  font-size: 0.56rem; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 0.15rem;
}
.alloc-lv .lv-sub { font-size: 0.62rem; color: var(--tx3); margin-bottom: 0.7rem; line-height: 1.5; }
.alloc-row { display: flex; justify-content: space-between; gap: 0.8rem; font-size: 0.71rem; padding: 0.17rem 0; }
.alloc-row .k { color: var(--tx2); }
.alloc-row .v { color: var(--tx); white-space: nowrap; }
.alloc-row.big { padding-top: 0.45rem; }
.alloc-row.big .v { font-size: 1rem; color: var(--accent); }
.alloc-row.minus .v { color: var(--tx2); }

.alloc-bots { border-top: 1px solid var(--border); padding: 1rem 1.4rem 1.2rem; overflow-x: auto; }
.alloc-tbl { width: 100%; border-collapse: collapse; font-size: 0.7rem; min-width: 620px; }
.alloc-tbl th {
  text-align: right; font-weight: 400; font-size: 0.56rem; letter-spacing: 0.11em;
  text-transform: uppercase; color: var(--tx4); padding: 0 0 0.5rem;
}
.alloc-tbl th:first-child, .alloc-tbl td:first-child { text-align: left; }
.alloc-tbl td { text-align: right; padding: 0.34rem 0; border-top: 1px solid var(--border); }
.alloc-tbl td + td, .alloc-tbl th + th { padding-left: 1rem; }
.alloc-tbl tr.out td { color: var(--tx3); }
.alloc-tbl .why { font-size: 0.62rem; color: var(--tx3); }
.alloc-note { font-size: 0.62rem; color: var(--tx3); margin-top: 0.7rem; line-height: 1.55; }

/* Three levels or one, never two — auto-fit lands on two columns around
   500px and leaves Level 2 beside an empty cell that reads as a missing
   panel. The levels are a sequence (capital -> exposure -> per bot), so
   stacking them keeps the reading order intact. */
.alloc-lv .lv-foot {
  margin-top: 0.75rem; padding-top: 0.6rem; border-top: 1px dashed var(--border-h);
  font-size: 0.64rem; color: var(--tx3); line-height: 1.55;
}
.alloc-lv .lv-foot b { color: var(--accent); font-weight: 400; }
.alloc-row.eq { border-top: 1px solid var(--border-h); margin-top: 0.3rem; }
.alloc-row .bind { color: var(--accent); font-weight: 400; font-size: 0.62rem; }
.alloc-tbl td.dim { color: var(--tx3); }
.alloc-tbl .lim { color: var(--accent); font-size: 0.64rem; }
/* Headroom and shortfall are NOT profit and loss, so they must not borrow the
   red/green semantics — a ₩96M funding gap in loss-red reads as ₩96M lost.
   Amber = "your move"; the deeper amber-red = "your move, and it is blocking". */
.alloc-tbl td.gap { color: var(--accent); }
.alloc-tbl td.short { color: #c98a4d; font-weight: 500; }

.fund { margin-top: 1.4rem; padding-top: 1.1rem; border-top: 1px solid var(--border-h); }
.fund-hd {
  font-size: 0.56rem; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 0.7rem;
}
.alloc-note b { color: var(--tx2); font-weight: 500; }
@media (max-width: 900px) {
  .alloc-levels { grid-template-columns: 1fr; }
}

/* ── Grid ── */
.grid {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 2rem;
}

/* ── Strategy Rows ── */
.strats { display: flex; flex-direction: column; gap: 1px; background: var(--border); }

.strat {
  background: var(--s1);
  padding: 1.3rem 1.4rem;
  transition: background 0.2s;
}

.strat:hover { background: var(--s2); }

.strat-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 0.8rem;
}

.strat-name {
  font-family: var(--serif);
  font-size: 1.05rem;
  font-weight: 300;
}

.tag {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding: 0.15rem 0.55rem;
  border: 1px solid var(--border-h);
  color: var(--tx3);
}

.tag.live { border-color: var(--g); color: var(--g); }
.tag.paper { border-color: var(--accent); color: var(--accent); }
.tag.stale { border-color: var(--r); color: var(--r); }
.tag.manual { border-color: #8a8a8a; color: #8a8a8a; }
/* Real money, real fills, but a sleeve-only configuration that is NOT the one
   that passed the promotion gates. "Live" overstates it and "Paper" is simply
   false — the card used to claim both at once. */
.tag.testing { border-color: var(--purple); color: var(--purple); }

/* Hands-on sleeve: same card, no bot colour — it is Jae's own hand, not a bot. */
.strat.manual { box-shadow: inset 2px 0 0 #8a8a8a; }

.strat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 0.45rem 1.2rem;
}

.sg-lbl {
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--tx4);
}

.sg-val { font-size: 0.88rem; }
.sg-val.bold { font-weight: 500; }

/* Bot identity dot. Same colour as the card rail, chart line and feed. */
.bot-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  margin-right: 0.5rem; vertical-align: middle;
}
.alloc-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  margin-right: 0.45rem; vertical-align: middle;
}

/* Full-width row inside .strat-grid. grid-column: 1/-1 is what forces the
   next field onto a fresh line — Hybrid VB's US leg used to start wherever
   the KR leg happened to stop, so 'KR Win Rate' sat beside 'US Invested' and
   the two halves read as one undifferentiated block. */
.sg-sep {
  grid-column: 1 / -1;
  margin-top: 0.7rem;
  padding-top: 0.55rem;
  border-top: 1px solid var(--border);
  font-size: 0.56rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--tx4);
}
/* The first separator on a card has nothing above it to divide. */
.strat-grid > .sg-sep:first-child { margin-top: 0; padding-top: 0; border-top: 0; }

/* Holdings table */
.holds {
  margin-top: 0.8rem;
  padding-top: 0.7rem;
  border-top: 1px solid var(--border);
}

.hold-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 0.2rem 0;
  font-size: 0.8rem;
}

.hold-tk { color: var(--tx); min-width: 55px; font-weight: 400; }

/* 종목이 많은 카드(NMF2 30종목, 수동 슬리브)는 잘라내지 않고 스크롤시킨다.
   '+25 more' 로 접어 두면 정작 무엇을 들고 있는지 확인할 수가 없다. */
.holds.scroll { max-height: 15rem; overflow-y: auto; }
.holds.scroll::-webkit-scrollbar { width: 5px; }
.holds.scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* 종목명은 코드보다 길고 한글은 폭이 제각각이라 별도 폭을 준다. */
.hold-nm { color: var(--tx); font-weight: 400; min-width: 6.5rem; max-width: 11rem;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hold-det { color: var(--tx3); flex: 1; text-align: right; padding: 0 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hold-pl { min-width: 80px; text-align: right; }

/* Signal badge */
.sig {
  display: inline-block;
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 0.2rem 0.6rem;
  margin-top: 0.7rem;
}

.sig.long { background: var(--g-bg); border: 1px solid var(--g); color: var(--g); }
.sig.cash { background: var(--accent-d); border: 1px solid var(--accent); color: var(--accent); }
.sig.bear { background: var(--r-bg); border: 1px solid var(--r); color: var(--r); }

/* ── Strategy Comparison Chart ── */
.cmp {
  margin-bottom: 2rem;
  padding: 1.4rem 1.5rem;
  background: var(--s1);
  border: 1px solid var(--border);
}
.cmp-hdr { margin-bottom: 1rem; }
.cmp-title {
  font-family: var(--serif);
  font-weight: 300;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
  margin: 0;
}
.cmp-sub {
  font-size: 0.7rem;
  color: var(--tx3);
  margin-top: 0.25rem;
}
.cmp-chart {
  display: flex;
  gap: 0.4rem;
  align-items: stretch;
}
.cmp-y-axis {
  position: relative;
  width: 46px;
  flex-shrink: 0;
  height: 300px;
}
.cmp-y-axis span {
  position: absolute;
  right: 4px;
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--tx4);
  transform: translateY(-50%);
  white-space: nowrap;
}
.cmp-plot {
  flex: 1;
  position: relative;
  height: 300px;
}
.cmp-svg {
  width: 100%;
  height: 100%;
  display: block;
}
.cmp-x-axis {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  margin-top: 4px;
  height: 14px;
}
.cmp-x-axis span {
  position: absolute;
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--tx4);
  transform: translateX(-50%);
  white-space: nowrap;
}
.cmp-tooltip {
  position: absolute;
  top: 4px;
  background: var(--s3);
  border: 1px solid var(--border-h);
  padding: 0.5rem 0.7rem;
  pointer-events: none;
  z-index: 10;
  min-width: 200px;
}
.cmp-tt-date {
  font-family: var(--mono);
  color: var(--tx2);
  font-size: 0.62rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.3rem;
  margin-bottom: 0.35rem;
}
.cmp-tt-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.1rem 0;
  font-family: var(--serif);
  font-size: 0.78rem;
  white-space: nowrap;
}
.cmp-tt-pct {
  font-family: var(--mono);
