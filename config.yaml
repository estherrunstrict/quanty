# --- Korea ETF Momentum Rotation Strategy ---
# Multi-TF Dual Momentum: KODEX Silver Futures + TIGER Raw Materials
# Backtest (2014-2026): CAGR 40.1%, MDD -21.7%, Sharpe 1.24
korea_etf_momentum:
  etfs:
    "144600": "KODEX Silver Futures"
    "139220": "TIGER Raw Materials"
  # Strategy: Multi-TF Dual Momentum (Top 1, winner takes all)
  # Weights: 40% 1m + 30% 3m + 20% 6m + 10% 12m
  # Absolute filter: 12m return > 0, else go to CASH
  # Rebalance: Monthly (first trading day of each month)
  # Budget is set in capital_management section above
  invest_ratio: 0.95            # 95% of budget (slippage buffer)
  paper_trading: false          # true = paper, false = LIVE

