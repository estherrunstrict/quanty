[project]
name = "quanty"
version = "0.1.0"
description = "Adaptive Quant Trading Framework"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.30",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
optimize = ["optuna>=3.4"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
